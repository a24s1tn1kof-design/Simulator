<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Симулятор</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', system-ui, sans-serif;
            touch-action: manipulation;
            padding: 10px;
        }
        .phone {
            width: 375px;
            max-width: 100%;
            height: 750px;
            background: #0a0a0f;
            border-radius: 40px;
            padding: 18px;
            box-shadow: 0 30px 80px rgba(0,0,0,0.8), inset 0 0 0 2px #2a2a3a;
            position: relative;
            overflow: hidden;
        }
        .phone-screen {
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #0f0f1a 0%, #1a1a2e 100%);
            border-radius: 28px;
            padding: 20px 18px;
            overflow-y: auto;
            position: relative;
            scroll-behavior: smooth;
        }
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #fff;
            font-size: 12px;
            font-weight: 600;
            padding-bottom: 12px;
            border-bottom: 1px solid #1a1a2a;
            margin-bottom: 16px;
        }
        .status-icons { display: flex; gap: 6px; font-size: 13px; }

        .apps-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px 12px;
            margin-top: 20px;
        }
        .app-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            touch-action: manipulation;
            transition: transform 0.15s;
        }
        .app-item:active { transform: scale(0.92); }
        .app-icon {
            width: 62px;
            height: 62px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
        }
        .app-icon.study { background: linear-gradient(135deg, #4facfe, #00f2fe); }
        .app-icon.bank { background: linear-gradient(135deg, #43e97b, #38f9d7); }
        .app-icon.locked { background: linear-gradient(135deg, #2d2d44, #3d3d5c); opacity: 0.5; }
        .app-name { color: #bbb; font-size: 11px; font-weight: 500; text-align: center; }

        .modal {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(12px);
            border-radius: 28px;
            padding: 30px 22px;
            z-index: 100;
            overflow-y: auto;
        }
        .modal.active { display: block; }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .modal-header h2 { color: #fff; font-size: 22px; font-weight: 700; }
        .modal-close {
            background: rgba(255,255,255,0.08);
            border: none;
            color: #fff;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            touch-action: manipulation;
            transition: 0.2s;
        }
        .modal-close:active { transform: scale(0.9); background: rgba(255,0,0,0.2); }

        .profession-list { display: flex; flex-direction: column; gap: 12px; margin-top: 8px; }
        .profession-card {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 16px 18px;
            border: 1px solid rgba(255,255,255,0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.2s;
            cursor: pointer;
        }
        .profession-card:active { transform: scale(0.97); }
        .profession-card .info h3 { color: #fff; font-size: 15px; font-weight: 600; }
        .profession-card .info p { color: #888; font-size: 12px; margin-top: 2px; }
        .profession-card .info .detail {
            color: #4facfe;
            font-size: 11px;
            margin-top: 4px;
        }

        .profession-btn {
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            border: none;
            color: #fff;
            padding: 8px 18px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            touch-action: manipulation;
            transition: 0.2s;
            box-shadow: 0 4px 15px rgba(79,172,254,0.3);
            white-space: nowrap;
        }
        .profession-btn:active { transform: scale(0.92); }

        .empty-bank { text-align: center; padding: 50px 0; color: #555; }
        .empty-bank .big-icon { font-size: 64px; margin-bottom: 16px; }
        .empty-bank p { font-size: 14px; }

        .profession-detail {
            display: none;
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
            padding: 14px 16px;
            margin-top: 10px;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .profession-detail.open { display: block; }
        .profession-detail .row {
            display: flex;
            justify-content: space-between;
            color: #ccc;
            font-size: 13px;
            padding: 4px 0;
        }
        .profession-detail .row .label { color: #888; }
        .profession-detail .row .value { color: #fff; font-weight: 500; }
        .profession-detail .exam-date {
            color: #f5c842;
            font-size: 13px;
            margin-top: 8px;
            text-align: center;
            border-top: 1px solid rgba(255,255,255,0.05);
            padding-top: 8px;
        }

        .phone-screen::-webkit-scrollbar { width: 3px; }
        .phone-screen::-webkit-scrollbar-track { background: transparent; }
        .phone-screen::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
        @media (max-width: 400px) {
            .phone { height: 95vh; border-radius: 28px; padding: 12px; }
            .phone-screen { border-radius: 20px; padding: 14px; }
            .app-icon { width: 54px; height: 54px; font-size: 24px; }
            .apps-grid { gap: 14px 8px; }
        }
    </style>
</head>
<body>
<div class="phone">
    <div class="phone-screen" id="phoneScreen">

        <!-- СТАТУС-БАР -->
        <div class="status-bar">
            <span id="statusTime">12:00</span>
            <div class="status-icons">
                <span>📶</span>
                <span>📶</span>
                <span>🔋</span>
            </div>
        </div>

        <!-- ПРИЛОЖЕНИЯ -->
        <div class="apps-grid">
            <div class="app-item" onclick="openStudy()">
                <div class="app-icon study">📚</div>
                <span class="app-name">Учеба</span>
            </div>
            <div class="app-item" onclick="openBank()">
                <div class="app-icon bank">🏦</div>
                <span class="app-name">Банк</span>
            </div>
            <div class="app-item">
                <div class="app-icon locked">🔒</div>
                <span class="app-name">Скоро</span>
            </div>
        </div>

        <!-- МОДАЛКА УЧЕБА -->
        <div class="modal" id="studyModal">
            <div class="modal-header">
                <h2>Учеба</h2>
                <button class="modal-close" onclick="closeStudy()">✕</button>
            </div>
            <div id="studyContent"></div>
        </div>

        <!-- МОДАЛКА БАНК -->
        <div class="modal" id="bankModal">
            <div class="modal-header">
                <h2>Банк</h2>
                <button class="modal-close" onclick="closeBank()">✕</button>
            </div>
            <div class="empty-bank">
                <div class="big-icon">🏦</div>
                <p style="color:#888;font-size:15px;font-weight:500;">Банковский отдел</p>
                <p style="color:#555;font-size:12px;margin-top:6px;">В разработке...</p>
            </div>
        </div>
    </div>
</div>

<script>
    // ===== ВРЕМЯ =====
    function updateTime() {
        var now = new Date();
        var h = String(now.getHours()).padStart(2, '0');
        var m = String(now.getMinutes()).padStart(2, '0');
        document.getElementById('statusTime').textContent = h + ':' + m;
    }
    updateTime();
    setInterval(updateTime, 10000);

    // ===== ПРИЛОЖЕНИЯ =====
    function openStudy() {
        document.getElementById('studyModal').classList.add('active');
        renderStudy();
    }

    function closeStudy() {
        document.getElementById('studyModal').classList.remove('active');
    }

    function openBank() {
        document.getElementById('bankModal').classList.add('active');
    }

    function closeBank() {
        document.getElementById('bankModal').classList.remove('active');
    }

    // Закрытие по клику на фон
    document.getElementById('studyModal').addEventListener('click', function(e) {
        if (e.target === this) this.classList.remove('active');
    });
    document.getElementById('bankModal').addEventListener('click', function(e) {
        if (e.target === this) this.classList.remove('active');
    });

    // ===== ПРОФЕССИИ =====
    var professions = [
        { 
            id: 'fsb', 
            name: 'ФСБ', 
            desc: 'Федеральная служба безопасности',
            trainingTime: '14 дней',
            examDate: 'Экзамен: 7-й и 14-й день'
        },
        { 
            id: 'mchs', 
            name: 'МЧС', 
            desc: 'Спасатель, пожарный',
            trainingTime: '14 дней',
            examDate: 'Экзамен: 7-й и 14-й день'
        },
        { 
            id: 'medic', 
            name: 'Медик', 
            desc: 'Врач, фельдшер',
            trainingTime: '14 дней',
            examDate: 'Экзамен: 7-й и 14-й день'
        },
        { 
            id: 'mvd', 
            name: 'МВД', 
            desc: 'Полицейский, следователь',
            trainingTime: '14 дней',
            examDate: 'Экзамен: 7-й и 14-й день'
        },
        { 
            id: 'teacher', 
            name: 'Учитель', 
            desc: 'Преподаватель, наставник',
            trainingTime: '14 дней',
            examDate: 'Экзамен: 7-й и 14-й день'
        }
    ];

    var selectedProfession = null;
    var openedDetail = null;

    function renderStudy() {
        var content = document.getElementById('studyContent');
        var html = '<div class="profession-list">';
        
        for (var i = 0; i < professions.length; i++) {
            var p = professions[i];
            var isOpen = (openedDetail === p.id);
            var isSelected = (selectedProfession === p.id);
            
            html += `
                <div class="profession-card" onclick="toggleDetail('${p.id}')">
                    <div class="info">
                        <h3>${p.name}</h3>
                        <p>${p.desc}</p>
                        <div class="detail">${isSelected ? 'Профессия выбрана' : 'Нажмите для выбора'}</div>
                    </div>
                    <button class="profession-btn" onclick="event.stopPropagation(); selectProfession('${p.id}')" ${isSelected ? 'disabled style="opacity:0.5;"' : ''}>
                        ${isSelected ? 'Выбрана' : 'Выбрать'}
                    </button>
                </div>
                <div class="profession-detail ${isOpen ? 'open' : ''}" id="detail-${p.id}">
                    <div class="row">
                        <span class="label">Время обучения</span>
                        <span class="value">${p.trainingTime}</span>
                    </div>
                    <div class="row">
                        <span class="label">Экзамены</span>
                        <span class="value">${p.examDate}</span>
                    </div>
                    <div class="exam-date">
                        ${isSelected ? 'Вы проходите обучение по этой профессии' : 'Выберите профессию для начала обучения'}
                    </div>
                </div>
            `;
        }
        
        html += '</div>';
        content.innerHTML = html;
    }

    function toggleDetail(id) {
        if (openedDetail === id) {
            openedDetail = null;
        } else {
            openedDetail = id;
        }
        renderStudy();
    }

    function selectProfession(id) {
        if (selectedProfession) {
            alert('Профессия уже выбрана!');
            return;
        }
        selectedProfession = id;
        renderStudy();
    }

    // ===== ЗАПУСК =====
    renderStudy();
</script>
</body>
    </html>
