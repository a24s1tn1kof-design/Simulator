<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0a0f">
    <title>Симулятор который ты ждал</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            touch-action: manipulation;
            padding: 10px;
        }

        /* Телефон */
        .phone {
            width: 375px;
            max-width: 100%;
            height: 750px;
            background: #0a0a0f;
            border-radius: 40px;
            padding: 18px;
            box-shadow: 0 30px 80px rgba(0,0,0,0.8), inset 0 0 0 2px #2a2a3a;
            position: relative;
            overflow: hidden;
        }

        .phone-screen {
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #0f0f1a 0%, #1a1a2e 100%);
            border-radius: 28px;
            padding: 20px 18px;
            overflow-y: auto;
            position: relative;
            scroll-behavior: smooth;
        }

        /* Статус-бар */
        .status-bar {
            display: flex;
            justify-content: space-between;
            color: #888;
            font-size: 12px;
            font-weight: 600;
            padding-bottom: 12px;
            border-bottom: 1px solid #1a1a2a;
            margin-bottom: 16px;
        }

        .status-bar .time { color: #fff; }
        .status-icons { display: flex; gap: 6px; }

        /* Заголовок */
        .app-title {
            text-align: center;
            color: #fff;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
            background: linear-gradient(90deg, #f7971e, #ffd200);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .app-subtitle {
            text-align: center;
            color: #555;
            font-size: 11px;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        /* Сетка приложений */
        .apps-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px 12px;
            margin-bottom: 24px;
        }

        .app-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            touch-action: manipulation;
            transition: transform 0.15s;
        }
        .app-item:active { transform: scale(0.92); }

        .app-icon {
            width: 62px;
            height: 62px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
            transition: 0.2s;
        }

        .app-icon.study { background: linear-gradient(135deg, #4facfe, #00f2fe); }
        .app-icon.bank { background: linear-gradient(135deg, #43e97b, #38f9d7); }
        .app-icon.locked { background: linear-gradient(135deg, #2d2d44, #3d3d5c); opacity: 0.5; }

        .app-name {
            color: #bbb;
            font-size: 11px;
            font-weight: 500;
            text-align: center;
        }

        /* Блок информации */
        .info-block {
            background: rgba(255,255,255,0.04);
            border-radius: 16px;
            padding: 14px 16px;
            border: 1px solid rgba(255,255,255,0.05);
            margin: 6px 0 16px;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            color: #aaa;
            font-size: 13px;
            padding: 4px 0;
        }
        .info-row .label { color: #666; }
        .info-row .value { color: #fff; font-weight: 600; }
        .info-row .value.gold { color: #f5c842; }

        /* Модальное окно */
        .modal {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(12px);
            border-radius: 28px;
            padding: 30px 22px;
            z-index: 100;
            overflow-y: auto;
        }
        .modal.active { display: block; }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .modal-header h2 {
            color: #fff;
            font-size: 22px;
            font-weight: 700;
        }
        .modal-close {
            background: rgba(255,255,255,0.08);
            border: none;
            color: #fff;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            touch-action: manipulation;
            transition: 0.2s;
        }
        .modal-close:active { transform: scale(0.9); background: rgba(255,0,0,0.2); }

        .profession-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 8px;
        }

        .profession-card {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 16px 18px;
            border: 1px solid rgba(255,255,255,0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.2s;
        }
        .profession-card:active { transform: scale(0.97); }
        .profession-card .info h3 {
            color: #fff;
            font-size: 15px;
            font-weight: 600;
        }
        .profession-card .info p {
            color: #888;
            font-size: 12px;
            margin-top: 2px;
        }
        .profession-card .info .req {
            color: #f5c842;
            font-size: 11px;
            font-weight: 500;
        }

        .profession-btn {
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            border: none;
            color: #fff;
            padding: 8px 18px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            touch-action: manipulation;
            transition: 0.2s;
            box-shadow: 0 4px 15px rgba(79,172,254,0.3);
            white-space: nowrap;
        }
        .profession-btn:active { transform: scale(0.92); }
        .profession-btn:disabled {
            opacity: 0.4;
            transform: none;
            box-shadow: none;
        }
        .profession-btn.learned {
            background: #2ecc71;
            box-shadow: 0 4px 15px rgba(46,204,113,0.3);
        }

        .empty-bank {
            text-align: center;
            padding: 50px 0;
            color: #555;
        }
        .empty-bank .big-icon { font-size: 64px; margin-bottom: 16px; }
        .empty-bank p { font-size: 14px; }

        /* Скролл */
        .phone-screen::-webkit-scrollbar { width: 3px; }
        .phone-screen::-webkit-scrollbar-track { background: transparent; }
        .phone-screen::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }

        /* Адаптив */
        @media (max-width: 400px) {
            .phone { height: 95vh; border-radius: 28px; padding: 12px; }
            .phone-screen { border-radius: 20px; padding: 14px; }
            .app-icon { width: 54px; height: 54px; font-size: 24px; }
            .apps-grid { gap: 14px 8px; }
        }
    </style>
</head>
<body>

<div class="phone">
    <div class="phone-screen" id="phoneScreen">

        <!-- Статус-бар -->
        <div class="status-bar">
            <span class="time" id="statusTime">12:00</span>
            <div class="status-icons">
                <span>📶</span>
                <span>📶</span>
                <span>🔋</span>
            </div>
        </div>

        <!-- Заголовок -->
        <div class="app-title">СИМУЛЯТОР КОТОРЫЙ ТЫ ЖДАЛ</div>
        <div class="app-subtitle">✦ ЖИЗНЕННЫЙ ПУТЬ ✦</div>

        <!-- Сетка приложений -->
        <div class="apps-grid">
            <div class="app-item" id="studyApp">
                <div class="app-icon study">📚</div>
                <span class="app-name">Учеба</span>
            </div>
            <div class="app-item" id="bankApp">
                <div class="app-icon bank">🏦</div>
                <span class="app-name">Банк</span>
            </div>
            <div class="app-item">
                <div class="app-icon locked">🔒</div>
                <span class="app-name">Скоро</span>
            </div>
        </div>

        <!-- Инфо-блок -->
        <div class="info-block">
            <div class="info-row">
                <span class="label">💰 Деньги</span>
                <span class="value gold" id="moneyDisplay">0</span>
            </div>
            <div class="info-row">
                <span class="label">🎓 Профессия</span>
                <span class="value" id="professionDisplay">Нет</span>
            </div>
            <div class="info-row">
                <span class="label">⭐ Уровень</span>
                <span class="value" id="levelDisplay">1</span>
            </div>
        </div>

        <!-- Модальное окно: Учеба -->
        <div class="modal" id="studyModal">
            <div class="modal-header">
                <h2>📚 Учеба</h2>
                <button class="modal-close" id="closeStudy">✕</button>
            </div>
            <div class="profession-list" id="professionList">
                <!-- Сгенерируется JS -->
            </div>
        </div>

        <!-- Модальное окно: Банк -->
        <div class="modal" id="bankModal">
            <div class="modal-header">
                <h2>🏦 Банк</h2>
                <button class="modal-close" id="closeBank">✕</button>
            </div>
            <div class="empty-bank">
                <div class="big-icon">🏦</div>
                <p style="color:#888;font-size:15px;font-weight:500;">Банковский отдел</p>
                <p style="color:#555;font-size:12px;margin-top:6px;">В разработке...<br>Скоро тут будут кредиты, вклады и ипотека</p>
                <div style="margin-top:20px;font-size:40px;">🔄</div>
            </div>
        </div>

    </div>
</div>

<script>
    // ===== ДАННЫЕ =====
    const professions = [
        { id: 'mchs', name: '🚒 МЧС', cost: 500, desc: 'Спасатель, пожарный' },
        { id: 'medic', name: '🏥 Медик', cost: 800, desc: 'Врач, фельдшер' },
        { id: 'fsb', name: '🕵️ ФСБ', cost: 1500, desc: 'Сотрудник госбезопасности' },
        { id: 'mvd', name: '👮 МВД', cost: 1200, desc: 'Полицейский, следователь' },
        { id: 'teacher', name: '👨‍🏫 Учитель', cost: 600, desc: 'Преподаватель, наставник' }
    ];

    // ===== СОСТОЯНИЕ =====
    let state = {
        money: 0,
        profession: null,
        level: 1,
        learned: []
    };

    // ===== DOM =====
    const moneyDisplay = document.getElementById('moneyDisplay');
    const professionDisplay = document.getElementById('professionDisplay');
    const levelDisplay = document.getElementById('levelDisplay');
    const studyModal = document.getElementById('studyModal');
    const bankModal = document.getElementById('bankModal');
    const professionList = document.getElementById('professionList');
    const statusTime = document.getElementById('statusTime');

    // ===== ФУНКЦИИ =====
    function updateUI() {
        moneyDisplay.textContent = state.money;
        professionDisplay.textContent = state.profession 
            ? professions.find(p => p.id === state.profession)?.name || 'Нет'
            : 'Нет';
        levelDisplay.textContent = state.level;
        renderProfessions();
        saveGame();
    }

    function renderProfessions() {
        professionList.innerHTML = '';
        professions.forEach(p => {
            const isLearned = state.learned.includes(p.id);
            const isCurrent = state.profession === p.id;
            const canAfford = state.money >= p.cost;

            const card = document.createElement('div');
            card.className = 'profession-card';

            const infoDiv = document.createElement('div');
            infoDiv.className = 'info';
            infoDiv.innerHTML = `
                <h3>${p.name}</h3>
                <p>${p.desc}</p>
                <span class="req">${isLearned ? '✅ Выучено' : `💰 ${p.cost} $`}</span>
            `;

            const btn = document.createElement('button');
            btn.className = 'profession-btn';
            if (isLearned) {
                btn.classList.add('learned');
                btn.textContent = isCurrent ? '✅ Активно' : 'Выбрать';
                btn.disabled = isCurrent;
            } else {
                btn.textContent = 'Учиться';
                btn.disabled = !canAfford;
            }

            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                if (isLearned) {
                    state.profession = p.id;
                    updateUI();
                } else {
                    if (state.money >= p.cost) {
                        state.money -= p.cost;
                        state.learned.push(p.id);
                        state.profession = p.id;
                        state.level += 1;
                        const bonus = Math.floor(p.cost * 0.1);
                        state.money += bonus;
                        updateUI();
                    }
                }
            });

            card.appendChild(infoDiv);
            card.appendChild(btn);
            professionList.appendChild(card);
        });
    }

    function saveGame() {
        try {
            localStorage.setItem('simulatorLife', JSON.stringify(state));
        } catch(e) {}
    }

    function loadGame() {
        try {
            const saved = localStorage.getItem('simulatorLife');
            if (saved) {
                const data = JSON.parse(saved);
                state.money = data.money || 0;
                state.profession = data.profession || null;
                state.level = data.level || 1;
                state.learned = data.learned || [];
            }
        } catch(e) {}
    }

    // ===== ЗАРАБОТОК =====
    function workIncome() {
        let income = 1;
        if (state.profession) {
            const prof = professions.find(p => p.id === state.profession);
            if (prof) {
                income = Math.floor(prof.cost / 100) + 2;
            }
        }
        income += state.level;
        state.money += income;
        updateUI();
    }

    // ===== ВРЕМЯ =====
    function updateTime() {
        const now = new Date();
        const h = String(now.getHours()).padStart(2, '0');
        const m = String(now.getMinutes()).padStart(2, '0');
        statusTime.textContent = `${h}:${m}`;
    }

    // ===== СОБЫТИЯ =====
    document.getElementById('studyApp').addEventListener('click', () => {
        studyModal.classList.add('active');
        renderProfessions();
    });

    document.getElementById('bankApp').addEventListener('click', () => {
        bankModal.classList.add('active');
    });

    document.getElementById('closeStudy').addEventListener('click', () => {
        studyModal.classList.remove('active');
    });

    document.getElementById('closeBank').addEventListener('click', () => {
        bankModal.classList.remove('active');
    });

    studyModal.addEventListener('click', (e) => {
        if (e.target === studyModal) studyModal.classList.remove('active');
    });
    bankModal.addEventListener('click', (e) => {
        if (e.target === bankModal) bankModal.classList.remove('active');
    });

    // Тап по экрану для заработка
    document.getElementById('phoneScreen').addEventListener('click', (e) => {
        if (!e.target.closest('.modal') && !e.target.closest('.app-item') && !e.target.closest('.profession-btn')) {
            state.money += 1;
            updateUI();
        }
    });

    // ===== ЗАПУСК =====
    loadGame();
    updateUI();
    updateTime();
    setInterval(updateTime, 10000);
    setInterval(workIncome, 3000);

    console.log('🔥 Симулятор запущен! Тапай по экрану для заработка.');
</script>
</body>
                    </html>
