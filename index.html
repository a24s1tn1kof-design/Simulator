<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Симулятор</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', system-ui, sans-serif;
            touch-action: manipulation;
            padding: 10px;
        }
        .phone {
            width: 375px;
            max-width: 100%;
            height: 750px;
            background: #0a0a0f;
            border-radius: 40px;
            padding: 18px;
            box-shadow: 0 30px 80px rgba(0,0,0,0.8), inset 0 0 0 2px #2a2a3a;
            position: relative;
            overflow: hidden;
        }
        .phone-screen {
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #0f0f1a 0%, #1a1a2e 100%);
            border-radius: 28px;
            padding: 20px 18px;
            overflow-y: auto;
            position: relative;
            scroll-behavior: smooth;
        }
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #fff;
            font-size: 12px;
            font-weight: 600;
            padding-bottom: 12px;
            border-bottom: 1px solid #1a1a2a;
            margin-bottom: 16px;
        }
        .status-icons { display: flex; gap: 6px; font-size: 13px; }

        .apps-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px 12px;
            margin-top: 20px;
        }
        .app-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            touch-action: manipulation;
            transition: transform 0.15s;
        }
        .app-item:active { transform: scale(0.92); }
        .app-icon {
            width: 62px;
            height: 62px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
        }
        .app-icon.study { background: linear-gradient(135deg, #4facfe, #00f2fe); }
        .app-icon.bank { background: linear-gradient(135deg, #43e97b, #38f9d7); }
        .app-icon.locked { background: linear-gradient(135deg, #2d2d44, #3d3d5c); opacity: 0.5; }
        .app-name { color: #bbb; font-size: 11px; font-weight: 500; text-align: center; }

        .modal {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(12px);
            border-radius: 28px;
            padding: 30px 22px;
            z-index: 100;
            overflow-y: auto;
        }
        .modal.active { display: block; }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .modal-header h2 { color: #fff; font-size: 22px; font-weight: 700; }
        .modal-close {
            background: rgba(255,255,255,0.08);
            border: none;
            color: #fff;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            touch-action: manipulation;
            transition: 0.2s;
        }
        .modal-close:active { transform: scale(0.9); background: rgba(255,0,0,0.2); }

        .profession-list { display: flex; flex-direction: column; gap: 12px; margin-top: 8px; }
        .profession-card {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 16px 18px;
            border: 1px solid rgba(255,255,255,0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.2s;
        }
        .profession-card .info h3 { color: #fff; font-size: 15px; font-weight: 600; }
        .profession-card .info p { color: #888; font-size: 12px; margin-top: 2px; }

        .profession-btn {
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            border: none;
            color: #fff;
            padding: 8px 18px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            touch-action: manipulation;
            transition: 0.2s;
            box-shadow: 0 4px 15px rgba(79,172,254,0.3);
            white-space: nowrap;
        }
        .profession-btn:active { transform: scale(0.92); }

        .empty-bank { text-align: center; padding: 50px 0; color: #555; }
        .empty-bank .big-icon { font-size: 64px; margin-bottom: 16px; }
        .empty-bank p { font-size: 14px; }

        .phone-screen::-webkit-scrollbar { width: 3px; }
        .phone-screen::-webkit-scrollbar-track { background: transparent; }
        .phone-screen::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
        @media (max-width: 400px) {
            .phone { height: 95vh; border-radius: 28px; padding: 12px; }
            .phone-screen { border-radius: 20px; padding: 14px; }
            .app-icon { width: 54px; height: 54px; font-size: 24px; }
            .apps-grid { gap: 14px 8px; }
        }
    </style>
</head>
<body>
<div class="phone">
    <div class="phone-screen" id="phoneScreen">

        <!-- СТАТУС-БАР -->
        <div class="status-bar">
            <span id="statusTime">12:00</span>
            <div class="status-icons">
                <span>📶</span>
                <span>📶</span>
                <span>🔋</span>
            </div>
        </div>

        <!-- ПРИЛОЖЕНИЯ -->
        <div class="apps-grid">
            <div class="app-item" onclick="openStudy()">
                <div class="app-icon study">📚</div>
                <span class="app-name">Учеба</span>
            </div>
            <div class="app-item" onclick="openBank()">
                <div class="app-icon bank">🏦</div>
                <span class="app-name">Банк</span>
            </div>
            <div class="app-item">
                <div class="app-icon locked">🔒</div>
                <span class="app-name">Скоро</span>
            </div>
        </div>

        <!-- МОДАЛКА УЧЕБА -->
        <div class="modal" id="studyModal">
            <div class="modal-header">
                <h2>Учеба</h2>
                <button class="modal-close" onclick="closeStudy()">✕</button>
            </div>
            <div id="studyContent"></div>
        </div>

        <!-- МОДАЛКА БАНК -->
        <div class="modal" id="bankModal">
            <div class="modal-header">
                <h2>Банк</h2>
                <button class="modal-close" onclick="closeBank()">✕</button>
            </div>
            <div class="empty-bank">
                <div class="big-icon">🏦</div>
                <p style="color:#888;font-size:15px;font-weight:500;">Банковский отдел</p>
                <p style="color:#555;font-size:12px;margin-top:6px;">В разработке...</p>
            </div>
        </div>
    </div>
</div>

<script>
    // ===== ВРЕМЯ =====
    function updateTime() {
        var now = new Date();
        var h = String(now.getHours()).padStart(2, '0');
        var m = String(now.getMinutes()).padStart(2, '0');
        document.getElementById('statusTime').textContent = h + ':' + m;
    }
    updateTime();
    setInterval(updateTime, 10000);

    // ===== ПРИЛОЖЕНИЯ =====
    function openStudy() {
        document.getElementById('studyModal').classList.add('active');
        renderStudy();
    }

    function closeStudy() {
        document.getElementById('studyModal').classList.remove('active');
    }

    function openBank() {
        document.getElementById('bankModal').classList.add('active');
    }

    function closeBank() {
        document.getElementById('bankModal').classList.remove('active');
    }

    // Закрытие по клику на фон
    document.getElementById('studyModal').addEventListener('click', function(e) {
        if (e.target === this) this.classList.remove('active');
    });
    document.getElementById('bankModal').addEventListener('click', function(e) {
        if (e.target === this) this.classList.remove('active');
    });

    // ===== ПРОФЕССИИ =====
    var professions = [
        { id: 'mchs', name: 'МЧС', desc: 'Спасатель, пожарный' },
        { id: 'medic', name: 'Медик', desc: 'Врач, фельдшер' },
        { id: 'fsb', name: 'ФСБ', desc: 'Сотрудник госбезопасности' },
        { id: 'mvd', name: 'МВД', desc: 'Полицейский, следователь' },
        { id: 'teacher', name: 'Учитель', desc: 'Преподаватель, наставник' }
    ];

    var selectedProfession = null;

    function renderStudy() {
        var content = document.getElementById('studyContent');
        if (!selectedProfession) {
            var html = '<div class="profession-list">';
            for (var i = 0; i < professions.length; i++) {
                var p = professions[i];
                html += `
                    <div class="profession-card">
                        <div class="info">
                            <h3>${p.name}</h3>
                            <p>${p.desc}</p>
                        </div>
                        <button class="profession-btn" onclick="selectProfession('${p.id}')">Выбрать</button>
                    </div>
                `;
            }
            html += '</div>';
            content.innerHTML = html;
            return;
        }

        var prof = null;
        for (var j = 0; j < professions.length; j++) {
            if (professions[j].id === selectedProfession) {
                prof = professions[j];
                break;
            }
        }

        content.innerHTML = `
            <div style="background:rgba(46,204,113,0.1);border:1px solid #2ecc71;border-radius:16px;padding:20px;text-align:center;">
                <div style="font-size:32px;margin-bottom:8px;">🎓</div>
                <div style="color:#fff;font-size:20px;font-weight:600;">${prof ? prof.name : ''}</div>
                <div style="color:#aaa;font-size:14px;margin-top:4px;">${prof ? prof.desc : ''}</div>
                <div style="color:#2ecc71;font-size:13px;margin-top:12px;">✅ Профессия выбрана</div>
                <button class="profession-btn" onclick="resetProfession()" style="margin-top:16px;background:#e74c3c;box-shadow:none;">Сбросить</button>
            </div>
        `;
    }

    function selectProfession(id) {
        if (selectedProfession) {
            alert('Профессия уже выбрана!');
            return;
        }
        selectedProfession = id;
        renderStudy();
    }

    function resetProfession() {
        selectedProfession = null;
        renderStudy();
    }

    // ===== ЗАПУСК =====
    renderStudy();
</script>
</body>
</html>
