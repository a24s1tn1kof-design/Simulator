<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Симулятор</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', system-ui, sans-serif;
            touch-action: none;
            padding: 10px;
        }
        .phone {
            width: 375px;
            max-width: 100%;
            height: 750px;
            background: #0a0a0f;
            border-radius: 40px;
            padding: 18px;
            box-shadow: 0 30px 80px rgba(0,0,0,0.8), inset 0 0 0 2px #2a2a3a;
            position: relative;
            overflow: hidden;
        }
        .phone-screen {
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #0f0f1a 0%, #1a1a2e 100%);
            border-radius: 28px;
            padding: 20px 18px;
            overflow-y: auto;
            position: relative;
            scroll-behavior: smooth;
        }
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #fff;
            font-size: 12px;
            font-weight: 600;
            padding-bottom: 12px;
            border-bottom: 1px solid #1a1a2a;
            margin-bottom: 16px;
        }
        .status-icons { display: flex; gap: 6px; font-size: 13px; align-items: center; }

        .apps-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px 12px;
            margin-top: 20px;
            position: relative;
            min-height: 350px;
        }
        .app-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            touch-action: none;
            transition: transform 0.15s;
            position: relative;
            z-index: 1;
            padding: 8px;
            border-radius: 12px;
        }
        .app-item:active { transform: scale(0.95); }
        .app-item.dragging {
            opacity: 0.5;
            transform: scale(0.9);
            z-index: 999;
        }
        .app-item.drag-over {
            transform: scale(1.05);
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
        }
        .app-item .drag-handle {
            font-size: 10px;
            opacity: 0.2;
            cursor: grab;
            margin-bottom: 2px;
            padding: 4px 8px;
            user-select: none;
            touch-action: none;
        }
        .app-item .drag-handle:active { cursor: grabbing; }
        .app-icon {
            width: 62px;
            height: 62px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
            pointer-events: none;
            transition: transform 0.15s;
        }
        .app-icon.study { background: linear-gradient(135deg, #4facfe, #00f2fe); }
        .app-icon.bank { background: linear-gradient(135deg, #43e97b, #38f9d7); }
        .app-icon.locked { background: linear-gradient(135deg, #2d2d44, #3d3d5c); opacity: 0.5; }
        .app-name { color: #bbb; font-size: 11px; font-weight: 500; text-align: center; pointer-events: none; }

        .modal {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(12px);
            border-radius: 28px;
            padding: 30px 22px;
            z-index: 100;
            overflow-y: auto;
        }
        .modal.active { display: block; }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .modal-header h2 { color: #fff; font-size: 22px; font-weight: 700; }
        .modal-close {
            background: rgba(255,255,255,0.08);
            border: none;
            color: #fff;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            touch-action: manipulation;
            transition: 0.2s;
        }
        .modal-close:active { transform: scale(0.9); background: rgba(255,0,0,0.2); }

        .profession-list { display: flex; flex-direction: column; gap: 12px; margin-top: 8px; }
        .profession-card {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 16px 18px;
            border: 1px solid rgba(255,255,255,0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.2s;
            cursor: pointer;
        }
        .profession-card:active { transform: scale(0.97); }
        .profession-card .info h3 { color: #fff; font-size: 15px; font-weight: 600; }
        .profession-card .info p { color: #888; font-size: 12px; margin-top: 2px; }

        .profession-btn {
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            border: none;
            color: #fff;
            padding: 8px 18px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            touch-action: manipulation;
            transition: 0.2s;
            box-shadow: 0 4px 15px rgba(79,172,254,0.3);
            white-space: nowrap;
        }
        .profession-btn:active { transform: scale(0.92); }
        .profession-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .profession-detail {
            display: none;
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
            padding: 14px 16px;
            margin-top: 10px;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .profession-detail.open { display: block; }
        .profession-detail .row {
            display: flex;
            justify-content: space-between;
            color: #ccc;
            font-size: 13px;
            padding: 4px 0;
        }
        .profession-detail .row .label { color: #888; }
        .profession-detail .row .value { color: #fff; font-weight: 500; }

        .selected-profession-block {
            background: rgba(46,204,113,0.1);
            border: 1px solid #2ecc71;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            margin-bottom: 16px;
        }
        .selected-profession-block .prof-name { color: #fff; font-size: 20px; font-weight: 600; }
        .selected-profession-block .prof-desc { color: #aaa; font-size: 13px; margin-top: 4px; }
        .selected-profession-block .status-text { color: #2ecc71; font-size: 13px; margin-top: 8px; }
        .selected-profession-block .days-left-big { color: #4facfe; font-size: 18px; font-weight: 700; margin-top: 6px; }

        .book-btn {
            background: #2ecc71;
            border: none;
            color: #fff;
            padding: 14px 20px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            touch-action: manipulation;
            transition: 0.2s;
            box-shadow: 0 4px 20px rgba(46,204,113,0.4);
            width: 100%;
            margin-top: 16px;
        }
        .book-btn:active { transform: scale(0.96); }

        .book-modal {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.92);
            backdrop-filter: blur(16px);
            border-radius: 28px;
            padding: 30px 22px;
            z-index: 200;
            overflow-y: auto;
        }
        .book-modal.active { display: block; }
        .book-modal .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .book-modal .modal-header h2 { color: #2ecc71; font-size: 20px; font-weight: 700; }
        .book-modal .modal-close {
            background: rgba(255,255,255,0.08);
            border: none;
            color: #fff;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
        }
        .book-content { color: #ddd; font-size: 14px; line-height: 1.6; }
        .book-content .question-block {
            background: rgba(255,255,255,0.04);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 14px;
            border-left: 3px solid #2ecc71;
        }
        .book-content .question-block .q { color: #fff; font-weight: 600; margin-bottom: 6px; }
        .book-content .question-block .a { color: #aaa; }

        .toast-custom {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.9);
            color: #fff;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 14px;
            border: 1px solid #333;
            backdrop-filter: blur(10px);
            white-space: nowrap;
            z-index: 200;
            transition: opacity 0.3s;
        }

        .phone-screen::-webkit-scrollbar { width: 3px; }
        .phone-screen::-webkit-scrollbar-track { background: transparent; }
        .phone-screen::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
        @media (max-width: 400px) {
            .phone { height: 95vh; border-radius: 28px; padding: 12px; }
            .phone-screen { border-radius: 20px; padding: 14px; }
            .app-icon { width: 54px; height: 54px; font-size: 24px; }
            .apps-grid { gap: 14px 8px; }
        }
    </style>
</head>

    <script>
    // ===== DRAG-AND-DROP ДЛЯ ИКОНОК =====
    var dragData = {
        dragEl: null,
        dragId: null,
        offsetX: 0,
        offsetY: 0,
        clone: null,
        isDragging: false
    };

    function initDrag() {
        var handles = document.querySelectorAll('.drag-handle');
        handles.forEach(function(handle) {
            handle.addEventListener('pointerdown', function(e) {
                e.preventDefault();
                e.stopPropagation();
                var item = handle.closest('.app-item');
                if (item) startDrag(e, item);
            });
        });

        document.addEventListener('pointermove', function(e) {
            if (dragData.isDragging) moveDrag(e);
        });

        document.addEventListener('pointerup', function(e) {
            if (dragData.isDragging) endDrag(e);
        });
    }

    function startDrag(e, item) {
        var rect = item.getBoundingClientRect();
        dragData.dragEl = item;
        dragData.dragId = item.dataset.id || item.id;
        dragData.offsetX = e.clientX - rect.left;
        dragData.offsetY = e.clientY - rect.top;
        dragData.isDragging = true;

        var clone = item.cloneNode(true);
        clone.style.position = 'fixed';
        clone.style.width = rect.width + 'px';
        clone.style.left = (e.clientX - dragData.offsetX) + 'px';
        clone.style.top = (e.clientY - dragData.offsetY) + 'px';
        clone.style.pointerEvents = 'none';
        clone.style.zIndex = '9999';
        clone.style.opacity = '0.85';
        clone.style.transform = 'scale(1.05)';
        clone.style.background = 'rgba(255,255,255,0.05)';
        clone.style.borderRadius = '12px';
        clone.style.padding = '8px';
        clone.style.boxShadow = '0 20px 60px rgba(0,0,0,0.5)';
        document.body.appendChild(clone);
        dragData.clone = clone;

        item.classList.add('dragging');
        item.style.opacity = '0.3';
    }

    function moveDrag(e) {
        if (!dragData.clone) return;
        dragData.clone.style.left = (e.clientX - dragData.offsetX) + 'px';
        dragData.clone.style.top = (e.clientY - dragData.offsetY) + 'px';

        var items = document.querySelectorAll('.app-item:not(.dragging)');
        items.forEach(function(item) {
            var rect = item.getBoundingClientRect();
            var centerX = rect.left + rect.width / 2;
            var centerY = rect.top + rect.height / 2;
            var dist = Math.sqrt(Math.pow(e.clientX - centerX, 2) + Math.pow(e.clientY - centerY, 2));
            if (dist < 80) item.classList.add('drag-over');
            else item.classList.remove('drag-over');
        });
    }

    function endDrag(e) {
        if (!dragData.isDragging) return;
        if (dragData.clone) { dragData.clone.remove(); dragData.clone = null; }

        var items = document.querySelectorAll('.app-item:not(.dragging)');
        var targetItem = null;
        var minDist = Infinity;

        items.forEach(function(item) {
            var rect = item.getBoundingClientRect();
            var centerX = rect.left + rect.width / 2;
            var centerY = rect.top + rect.height / 2;
            var dist = Math.sqrt(Math.pow(e.clientX - centerX, 2) + Math.pow(e.clientY - centerY, 2));
            if (dist < 80 && dist < minDist) { minDist = dist; targetItem = item; }
        });

        var dragEl = dragData.dragEl;
        dragEl.classList.remove('dragging');
        dragEl.style.opacity = '1';
        items.forEach(function(item) { item.classList.remove('drag-over'); });

        if (targetItem && targetItem !== dragEl) {
            var grid = document.getElementById('appsGrid');
            var dragIndex = Array.from(grid.children).indexOf(dragEl);
            var targetIndex = Array.from(grid.children).indexOf(targetItem);
            if (dragIndex < targetIndex) grid.insertBefore(dragEl, targetItem.nextSibling);
            else grid.insertBefore(dragEl, targetItem);
            saveAppOrder();
        }

        dragData.isDragging = false;
        dragData.dragEl = null;
    }

    function saveAppOrder() {
        var grid = document.getElementById('appsGrid');
        var order = [];
        grid.querySelectorAll('.app-item').forEach(function(item) {
            order.push(item.id || '');
        });
        localStorage.setItem('appOrder', JSON.stringify(order));
    }

    function loadAppOrder() {
        try {
            var saved = localStorage.getItem('appOrder');
            if (saved) {
                var order = JSON.parse(saved);
                var grid = document.getElementById('appsGrid');
                var items = grid.querySelectorAll('.app-item');
                var map = {};
                items.forEach(function(item) { if (item.id) map[item.id] = item; });
                grid.innerHTML = '';
                order.forEach(function(id) { if (map[id]) grid.appendChild(map[id]); });
                var allIds = ['studyAppBtn', 'bankAppBtn'];
                allIds.forEach(function(id) { if (!order.includes(id) && map[id]) grid.appendChild(map[id]); });
                // Добавляем locked если его нет
                var locked = document.querySelector('.app-item .locked');
                if (locked) {
                    var parent = locked.closest('.app-item');
                    if (parent && !grid.contains(parent)) grid.appendChild(parent);
                }
                initDrag();
            }
        } catch(e) {}
    }

    setTimeout(function() { loadAppOrder(); initDrag(); }, 100);
    </script>

    .sber-history::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }

    <script>
    // ===== НАСТОЯЩЕЕ ВРЕМЯ =====
    function updateTime() {
        var now = new Date();
        var h = String(now.getHours()).padStart(2, '0');
        var m = String(now.getMinutes()).padStart(2, '0');
        document.getElementById('statusTime').textContent = h + ':' + m;
    }
    updateTime();
    setInterval(updateTime, 5000);

    // ===== НАСТОЯЩАЯ БАТАРЕЯ =====
    function updateBattery() {
        if (navigator.getBattery) {
            navigator.getBattery().then(function(battery) {
                var level = Math.round(battery.level * 100);
                var el = document.getElementById('batteryDisplay');
                el.textContent = '🔋 ' + level + '%';
                if (level < 20) el.style.color = '#e74c3c';
                else if (level < 50) el.style.color = '#f5c842';
                else el.style.color = '#2ecc71';
            }).catch(function() {
                document.getElementById('batteryDisplay').textContent = '🔋 72%';
            });
        } else {
            document.getElementById('batteryDisplay').textContent = '🔋 68%';
        }
    }
    updateBattery();
    setInterval(updateBattery, 5000);

    // ===== ПРОФЕССИИ =====
    var professions = [
        { id: 'fsb', name: 'ФСБ', desc: 'Федеральная служба безопасности' },
        { id: 'mchs', name: 'МЧС', desc: 'Спасатель, пожарный' },
        { id: 'medic', name: 'Медик', desc: 'Врач, фельдшер' },
        { id: 'mvd', name: 'МВД', desc: 'Полицейский, следователь' },
        { id: 'teacher', name: 'Учитель', desc: 'Преподаватель, наставник' }
    ];

    var selectedProfession = localStorage.getItem('selectedProfession') || null;
    var startDate = localStorage.getItem('startDate') || null;

    function getDaysLeft() {
        if (!startDate) return 14;
        var start = new Date(startDate);
        var now = new Date();
        var diff = Math.floor((now - start) / (1000 * 60 * 60 * 24));
        var left = 14 - diff;
        return left < 0 ? 0 : left;
    }

    function getDaysPassed() {
        if (!startDate) return 0;
        var start = new Date(startDate);
        var now = new Date();
        return Math.floor((now - start) / (1000 * 60 * 60 * 24));
    }

    function renderStudy() {
        var content = document.getElementById('studyContent');
        if (selectedProfession) {
            var prof = null;
            for (var i = 0; i < professions.length; i++) {
                if (professions[i].id === selectedProfession) { prof = professions[i]; break; }
            }
            var daysLeft = getDaysLeft();
            var daysPassed = getDaysPassed();
            var finished = daysLeft <= 0;

            content.innerHTML = `
                <div class="selected-profession-block">
                    <div class="prof-name">${prof ? prof.name : ''}</div>
                    <div class="prof-desc">${prof ? prof.desc : ''}</div>
                    <div class="status-text">${finished ? 'Обучение завершено' : 'Профессия выбрана'}</div>
                    <div class="days-left-big">${finished ? 'Обучение завершено' : 'Осталось дней: ' + daysLeft}</div>
                    <div style="color:#888;font-size:12px;margin-top:4px;">${finished ? 'Вы успешно освоили профессию' : 'День ' + Math.min(daysPassed, 14) + ' из 14'}</div>
                </div>
                <div class="profession-detail open">
                    <div class="row"><span class="label">Время обучения</span><span class="value">14 дней</span></div>
                    <div class="row"><span class="label">Экзамены</span><span class="value">7-й и 14-й день</span></div>
                    <div class="row"><span class="label">Осталось дней</span><span class="value" id="daysCounter">${finished ? 0 : daysLeft}</span></div>
                </div>
                <button class="book-btn" onclick="openBook()">📖 Книга для учения</button>
            `;
            return;
        }

        var html = '<div class="profession-list">';
        for (var j = 0; j < professions.length; j++) {
            var p = professions[j];
            html += `
                <div class="profession-card" onclick="selectProfession('${p.id}')">
                    <div class="info">
                        <h3>${p.name}</h3>
                        <p>${p.desc}</p>
                    </div>
                    <button class="profession-btn">Выбрать</button>
                </div>
            `;
        }
        html += '</div>';
        content.innerHTML = html;
    }

    function selectProfession(id) {
        if (selectedProfession) { showToast('Профессия уже выбрана!'); return; }
        selectedProfession = id;
        startDate = new Date().toISOString();
        localStorage.setItem('selectedProfession', id);
        localStorage.setItem('startDate', startDate);
        renderStudy();
        showToast('Обучение началось! Длительность: 14 дней.');
    }

    function openBook() {
        document.getElementById('bookModal').classList.add('active');
        renderBook();
    }

    function closeBook() {
        document.getElementById('bookModal').classList.remove('active');
    }

    function showToast(text) {
        var old = document.querySelector('.toast-custom');
        if (old) old.remove();
        var toast = document.createElement('div');
        toast.className = 'toast-custom';
        toast.textContent = text;
        document.getElementById('phoneScreen').appendChild(toast);
        setTimeout(function() { toast.remove(); }, 2500);
    }
    </script>
    <script>
    // ===== КНИГА ДЛЯ УЧЕНИЯ =====
    var bookQuestions = {
        fsb: [
            { q: 'В торговом центре неизвестные открыли стрельбу. Вы сотрудник ФСБ. Какие номера набрать и как организовать эвакуацию?', a: 'Набрать 112, 102 и 101. Немедленно начать координацию с охраной ТЦ: перекрыть выходы, направить людей к ближайшим эвакуационным выходам. Организовать группы по 5-10 человек. Укрыть раненых. Оценить обстановку.' },
            { q: 'Вы получили сообщение о заложенной бомбе. Вы сотрудник ФСБ. Ваши действия?', a: 'Набрать 112, 102, 101. Не паниковать, сообщить руководству. Начать эвакуацию по плану: выводить людей поэтапно. Проверить подозрительные места, оцепить здание.' }
        ],
        mchs: [
            { q: 'Произошло землетрясение силой 7 баллов. Вы спасатель МЧС. Как действовать?', a: 'Набрать 112 или 101. Лечь на пол рядом с кроватью, защитить голову. После толчков — покинуть здание по лестнице.' },
            { q: 'Обнаружено возгорание в многоквартирном доме. Что делать?', a: 'Вызвать пожарную службу по номеру 101 или 112. Если пожар небольшой — потушить огнетушителем. Если сильный — покинуть помещение.' }
        ],
        medic: [
            { q: 'У человека остановилось сердце. Что делать?', a: 'Набрать 103 или 112. Начать СЛР: 30 компрессий грудной клетки, 2 вдоха. Продолжать до приезда скорой.' },
            { q: 'Человек с признаками инсульта. Что делать?', a: 'Вызвать скорую по номеру 103 или 112. Уложить с приподнятой головой. Не давать еду и воду.' }
        ],
        mvd: [
            { q: 'Вы стали свидетелем ограбления. Что делать?', a: 'Набрать 102 или 112. Сообщить приметы преступников. Не вступать в конфликт.' },
            { q: 'Нашли подозрительный предмет в автобусе. Что делать?', a: 'Сообщить водителю, вызвать полицию по 102 или 112. Не трогать предмет, вывести людей.' }
        ],
        teacher: [
            { q: 'В классе паника из-за сообщения о стрельбе. Как успокоить детей?', a: 'Набрать 112 или 102. Успокоить учеников, закрыть двери, выключить свет.' },
            { q: 'Свидетель буллинга с ножом. Что делать?', a: 'Вызвать полицию по 102 или 112. Вмешаться, развести учеников.' }
        ]
    };

    function renderBook() {
        var prof = selectedProfession;
        if (!prof) { document.getElementById('bookContent').innerHTML = '<div style="color:#888;">Сначала выберите профессию</div>'; return; }
        var questions = bookQuestions[prof];
        if (!questions) { document.getElementById('bookContent').innerHTML = '<div style="color:#888;">Нет вопросов</div>'; return; }

        var html = '';
        for (var j = 0; j < questions.length; j++) {
            var q = questions[j];
            html += `
                <div class="question-block">
                    <div class="q">❓ ${q.q}</div>
                    <div class="a">${q.a}</div>
                </div>
            `;
        }
        document.getElementById('bookContent').innerHTML = html;
    }

    // ===== БАНК ДАННЫЕ =====
    var bankData = {
        registered: false,
        name: '',
        password: '',
        balance: 0,
        deposit: 0,
        depositDate: null,
        credit: 0,
        creditDate: null,
        creditAmount: 0,
        profession: '',
        loggedIn: false,
        cardNumber: '',
        phone: '',
        history: [],
        cardHidden: false
    };

    function generateCardNumber() {
        var num = '';
        for (var i = 0; i < 16; i++) {
            num += Math.floor(Math.random() * 10);
            if (i === 3 || i === 7 || i === 11) num += ' ';
        }
        return num;
    }

    function generatePhone() {
        var num = '';
        for (var i = 0; i < 11; i++) {
            num += Math.floor(Math.random() * 10);
        }
        return num;
    }

    function loadBankData() {
        try {
            var saved = localStorage.getItem('bankData');
            if (saved) {
                var data = JSON.parse(saved);
                bankData.registered = data.registered || false;
                bankData.name = data.name || '';
                bankData.password = data.password || '';
                bankData.balance = data.balance || 0;
                bankData.deposit = data.deposit || 0;
                bankData.depositDate = data.depositDate || null;
                bankData.credit = data.credit || 0;
                bankData.creditDate = data.creditDate || null;
                bankData.creditAmount = data.creditAmount || 0;
                bankData.profession = data.profession || '';
                bankData.cardNumber = data.cardNumber || generateCardNumber();
                bankData.phone = data.phone || generatePhone();
                bankData.history = data.history || [];
                bankData.cardHidden = data.cardHidden || false;
                bankData.loggedIn = false;
            }
        } catch(e) {}
    }

    function saveBankData() {
        try {
            var dataToSave = {
                registered: bankData.registered,
                name: bankData.name,
                password: bankData.password,
                balance: bankData.balance,
                deposit: bankData.deposit,
                depositDate: bankData.depositDate,
                credit: bankData.credit,
                creditDate: bankData.creditDate,
                creditAmount: bankData.creditAmount,
                profession: bankData.profession,
                cardNumber: bankData.cardNumber,
                phone: bankData.phone,
                history: bankData.history,
                cardHidden: bankData.cardHidden
            };
            localStorage.setItem('bankData', JSON.stringify(dataToSave));
        } catch(e) {}
    }

    function getProfessionFromStudy() {
        var prof = localStorage.getItem('selectedProfession') || '';
        if (prof) {
            var professionsMap = {
                'fsb': 'ФСБ',
                'mchs': 'МЧС',
                'medic': 'Медик',
                'mvd': 'МВД',
                'teacher': 'Учитель'
            };
            return professionsMap[prof] || prof;
        }
        return '';
    }
    </script>
    <script>
    // ===== РЕГИСТРАЦИЯ И ВХОД =====
    function renderBank() {
        var content = document.getElementById('bankContent');

        if (!bankData.registered) {
            var prof = getProfessionFromStudy();
            if (!prof) {
                content.innerHTML = `
                    <div style="color:#888;text-align:center;padding:30px 0;">
                        <div style="font-size:48px;margin-bottom:16px;">🏦</div>
                        <p style="font-size:15px;color:#ddd;">Для регистрации в банке</p>
                        <p style="font-size:13px;color:#888;margin-top:6px;">Сначала выберите профессию в учёбе</p>
                        <button class="sber-btn" onclick="closeBank();openStudy();" style="margin-top:16px;">Перейти к учёбе</button>
                    </div>
                `;
                return;
            }

            content.innerHTML = `
                <div style="text-align:center;margin-bottom:20px;">
                    <div style="font-size:48px;">🏦</div>
                    <div style="color:#fff;font-size:20px;font-weight:700;margin-top:6px;">СБЕРБАНК</div>
                    <div style="color:#888;font-size:13px;margin-top:2px;">Профессия: ${prof}</div>
                </div>
                <div style="display:flex;flex-direction:column;gap:10px;">
                    <input class="sber-input" id="regName" placeholder="Ваше имя" maxlength="20">
                    <input class="sber-input" id="regPassword" placeholder="Пин-код (4 цифры)" type="password" maxlength="4" inputmode="numeric">
                    <button class="sber-btn green" onclick="registerBank()">Зарегистрироваться</button>
                </div>
                <div style="text-align:center;margin-top:12px;color:#888;font-size:13px;">
                    Уже есть аккаунт? <span style="color:#4facfe;cursor:pointer;" onclick="showLogin()">Войти</span>
                </div>
            `;
            return;
        }

        if (!bankData.loggedIn) {
            content.innerHTML = `
                <div style="text-align:center;margin-bottom:20px;">
                    <div style="font-size:48px;">🏦</div>
                    <div style="color:#fff;font-size:18px;font-weight:600;margin-top:8px;">Здравствуйте, ${bankData.name}!</div>
                    <div style="color:#888;font-size:13px;margin-top:4px;">Введите пин-код для входа</div>
                </div>
                <div style="display:flex;flex-direction:column;gap:10px;">
                    <input class="sber-input" id="loginPassword" placeholder="Пин-код (4 цифры)" type="password" maxlength="4" inputmode="numeric">
                    <button class="sber-btn green" onclick="loginBank()">Войти</button>
                </div>
                <div style="text-align:center;margin-top:12px;color:#888;font-size:13px;">
                    <span style="color:#4facfe;cursor:pointer;" onclick="showRegistration()">Вернуться к регистрации</span>
                </div>
            `;
            return;
        }

        renderBankMain();
    }

    function showLogin() { renderBank(); }
    function showRegistration() { bankData.loggedIn = false; saveBankData(); renderBank(); }

    function registerBank() {
        var name = document.getElementById('regName').value.trim();
        var password = document.getElementById('regPassword').value.trim();

        if (!name) { showToast('Введите имя'); return; }
        if (name.length < 2) { showToast('Имя минимум 2 символа'); return; }
        if (!password || password.length !== 4 || isNaN(password)) {
            showToast('Пин-код — 4 цифры');
            return;
        }

        bankData.registered = true;
        bankData.name = name;
        bankData.password = password;
        bankData.balance = 100;
        bankData.cardNumber = generateCardNumber();
        bankData.phone = generatePhone();
        bankData.profession = getProfessionFromStudy();
        bankData.history = [];
        bankData.loggedIn = true;
        saveBankData();
        renderBank();
        showToast('✅ Регистрация успешна! Получен бонус 100 ₽');
    }

    function loginBank() {
        var password = document.getElementById('loginPassword').value.trim();

        if (!password || password.length !== 4 || isNaN(password)) {
            showToast('Введите пин-код (4 цифры)');
            return;
        }

        if (password === bankData.password) {
            bankData.loggedIn = true;
            saveBankData();
            renderBank();
            showToast('✅ Добро пожаловать, ' + bankData.name + '!');
        } else {
            showToast('❌ Неверный пин-код');
        }
    }

    function logoutBank() {
        bankData.loggedIn = false;
        saveBankData();
        renderBank();
        showToast('👋 Вы вышли из банка');
    }
    </script>
    <script>
    // ===== ГЛАВНЫЙ ЭКРАН БАНКА =====
    function renderBankMain() {
        var content = document.getElementById('bankContent');
        var daysLeft = getDaysLeft();
        var prof = getProfessionFromStudy();

        var displayNumber = bankData.cardNumber;

        content.innerHTML = `
            <div class="sber-card">
                <div class="bank-name">СБЕРБАНК</div>

                <div class="card-number-box ${bankData.cardHidden ? 'collapsed' : ''}" onclick="toggleCardHide()">
                    <div class="number ${bankData.cardHidden ? 'collapsed' : ''}">
                        ${displayNumber}
                    </div>
                </div>

                <div class="card-holder">${bankData.name}</div>
                <div class="card-bottom">
                    <span>${prof || 'Без профессии'}</span>
                    <span>До обучения: ${daysLeft} дн.</span>
                </div>
            </div>

            <div class="sber-balance">
                <span class="label">Баланс</span>
                <span class="amount">${bankData.balance} ₽</span>
            </div>

            <div class="sber-menu">
                <div class="sber-menu-item" onclick="showDeposit()">
                    <span class="icon">💰</span>
                    <span class="label">Вклад</span>
                </div>
                <div class="sber-menu-item" onclick="showCredit()">
                    <span class="icon">💳</span>
                    <span class="label">Кредит</span>
                </div>
                <div class="sber-menu-item" onclick="showTransfer()">
                    <span class="icon">📤</span>
                    <span class="label">Перевод</span>
                </div>
                <div class="sber-menu-item" onclick="logoutBank()">
                    <span class="icon">🚪</span>
                    <span class="label">Выйти</span>
                </div>
            </div>

            <div class="sber-history">
                <div class="history-title">📋 История переводов</div>
                ${renderHistory()}
            </div>
        `;
    }

    function renderHistory() {
        if (bankData.history.length === 0) {
            return '<div class="history-empty">История пуста</div>';
        }
        var html = '';
        for (var i = bankData.history.length - 1; i >= 0; i--) {
            var h = bankData.history[i];
            var amountClass = h.type === 'out' ? 'minus' : '';
            var sign = h.type === 'out' ? '-' : '+';
            html += `
                <div class="history-item">
                    <div class="h-left">
                        ${h.recipient || 'Перевод'}
                        <div class="h-detail">${h.time || ''}</div>
                    </div>
                    <div class="h-amount ${amountClass}">${sign}${h.amount} ₽</div>
                </div>
            `;
        }
        return html;
    }

    function toggleCardHide() {
        bankData.cardHidden = !bankData.cardHidden;
        saveBankData();
        renderBankMain();
    }
    </script>
    <script>
    // ===== ВКЛАД =====
    function showDeposit() {
        var content = document.getElementById('bankContent');
        var daysLeft = getDaysLeft();

        if (bankData.deposit > 0) {
            var earned = Math.floor(bankData.deposit * 0.1 * (14 - daysLeft));
            content.innerHTML = `
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
                    <button class="sber-back" onclick="renderBank()">← Назад</button>
                </div>
                <div class="sber-card">
                    <div class="bank-name">💰 ВКЛАД</div>
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;">
                        <span style="opacity:0.6;font-size:13px;">Сумма</span>
                        <span style="font-size:22px;font-weight:700;color:#f5c842;">${bankData.deposit} ₽</span>
                    </div>
                    <div style="color:#2ecc71;font-size:14px;margin-top:6px;">Доход: +10% в день</div>
                    <div style="color:#888;font-size:13px;">Заработано: ${earned} ₽</div>
                    <div style="color:#888;font-size:12px;">Осталось дней: ${daysLeft}</div>
                </div>
                <button class="sber-btn red" onclick="closeDeposit()">Закрыть вклад</button>
            `;
            return;
        }

        content.innerHTML = `
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
                <button class="sber-back" onclick="renderBank()">← Назад</button>
            </div>
            <div style="color:#fff;font-size:18px;font-weight:600;margin-bottom:12px;">💰 Открыть вклад</div>
            <div style="color:#888;font-size:13px;margin-bottom:6px;">Минимальная сумма: 50 ₽</div>
            <div style="color:#888;font-size:13px;margin-bottom:6px;">Доход: 10% от суммы каждый день</div>
            <div style="color:#888;font-size:13px;margin-bottom:16px;">Ваш баланс: ${bankData.balance} ₽</div>
            <input class="sber-input" id="depositAmount" placeholder="Сумма вклада" type="number" min="50">
            <button class="sber-btn green" onclick="openDeposit()">Открыть вклад</button>
        `;
    }

    function openDeposit() {
        var amount = parseInt(document.getElementById('depositAmount').value);
        if (!amount || amount < 50) { showToast('Минимальная сумма: 50 ₽'); return; }
        if (amount > bankData.balance) { showToast('Недостаточно средств'); return; }

        bankData.balance -= amount;
        bankData.deposit = amount;
        bankData.depositDate = new Date().toISOString();
        saveBankData();
        renderBank();
        showToast('✅ Вклад открыт!');
    }

    function closeDeposit() {
        var daysLeft = getDaysLeft();
        var earned = Math.floor(bankData.deposit * 0.1 * (14 - daysLeft));
        var total = bankData.deposit + earned;
        bankData.balance += total;
        bankData.deposit = 0;
        bankData.depositDate = null;
        saveBankData();
        renderBank();
        showToast('💰 Вклад закрыт. Получено: ' + total + ' ₽');
    }
    </script>
    <script>
    // ===== КРЕДИТ =====
    function showCredit() {
        var content = document.getElementById('bankContent');
        var daysLeft = getDaysLeft();

        if (bankData.credit > 0) {
            content.innerHTML = `
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
                    <button class="sber-back" onclick="renderBank()">← Назад</button>
                </div>
                <div class="sber-card" style="background:linear-gradient(135deg,#6d1a1a,#4a0d0d);">
                    <div class="bank-name">💳 КРЕДИТ</div>
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;">
                        <span style="opacity:0.6;font-size:13px;">Долг</span>
                        <span style="font-size:22px;font-weight:700;color:#e74c3c;">${bankData.credit} ₽</span>
                    </div>
                    <div style="color:#f5c842;font-size:14px;margin-top:6px;">Проценты: +20%</div>
                    <div style="color:#888;font-size:13px;">К возврату: ${Math.floor(bankData.credit * 1.2)} ₽</div>
                    <div style="color:#888;font-size:12px;">Осталось дней: ${daysLeft}</div>
                </div>
                <button class="sber-btn green" onclick="payCredit()" ${bankData.balance < Math.floor(bankData.credit * 1.2) ? 'disabled' : ''}>
                    ${bankData.balance >= Math.floor(bankData.credit * 1.2) ? 'Погасить кредит' : 'Недостаточно средств'}
                </button>
            `;
            return;
        }

        content.innerHTML = `
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
                <button class="sber-back" onclick="renderBank()">← Назад</button>
            </div>
            <div style="color:#fff;font-size:18px;font-weight:600;margin-bottom:12px;">💳 Взять кредит</div>
            <div style="color:#888;font-size:13px;margin-bottom:6px;">Максимальная сумма: ${bankData.balance * 2} ₽</div>
            <div style="color:#888;font-size:13px;margin-bottom:6px;">Проценты: 20% от суммы</div>
            <div style="color:#888;font-size:13px;margin-bottom:16px;">Срок: до окончания обучения</div>
            <input class="sber-input" id="creditAmount" placeholder="Сумма кредита" type="number" min="10">
            <button class="sber-btn" onclick="takeCredit()">Взять кредит</button>
        `;
    }

    function takeCredit() {
        var amount = parseInt(document.getElementById('creditAmount').value);
        if (!amount || amount < 10) { showToast('Минимальная сумма: 10 ₽'); return; }
        var maxCredit = bankData.balance * 2;
        if (amount > maxCredit) { showToast('Максимальная сумма: ' + maxCredit + ' ₽'); return; }

        bankData.balance += amount;
        bankData.credit = amount;
        bankData.creditAmount = amount;
        bankData.creditDate = new Date().toISOString();
        saveBankData();
        renderBank();
        showToast('✅ Кредит выдан! Сумма: ' + amount + ' ₽');
    }

    function payCredit() {
        var total = Math.floor(bankData.credit * 1.2);
        if (bankData.balance < total) { showToast('❌ Недостаточно средств'); return; }

        bankData.balance -= total;
        bankData.credit = 0;
        bankData.creditAmount = 0;
        bankData.creditDate = null;
        saveBankData();
        renderBank();
        showToast('✅ Кредит погашен!');
    }
    </script>
    <script>
    // ===== ПЕРЕВОД ПО КАРТЕ ИЛИ ТЕЛЕФОНУ =====
    var transferMethod = 'card';

    function showTransfer() {
        var content = document.getElementById('bankContent');
        content.innerHTML = `
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
                <button class="sber-back" onclick="renderBank()">← Назад</button>
            </div>
            <div style="color:#fff;font-size:18px;font-weight:600;margin-bottom:12px;">📤 Перевод</div>
            <div style="color:#888;font-size:13px;margin-bottom:12px;">Ваш баланс: ${bankData.balance} ₽</div>

            <div class="transfer-method">
                <button id="transferCardBtn" class="active" onclick="setTransferMethod('card')">💳 По карте</button>
                <button id="transferPhoneBtn" onclick="setTransferMethod('phone')">📱 По телефону</button>
            </div>

            <div id="transferInputs">
                <input class="sber-input" id="transferRecipient" placeholder="Номер карты (16 цифр)">
                <input class="sber-input" id="transferAmount" placeholder="Сумма перевода" type="number" min="1">
            </div>

            <button class="sber-btn green" onclick="makeTransfer()">Перевести</button>
            <div style="color:#555;font-size:12px;text-align:center;margin-top:8px;">Комиссия: 0 ₽</div>
        `;
        updateTransferMethodUI();
    }

    function setTransferMethod(method) {
        transferMethod = method;
        updateTransferMethodUI();
        var input = document.getElementById('transferRecipient');
        if (method === 'card') {
            input.placeholder = 'Номер карты (16 цифр)';
            input.maxLength = 19;
            input.type = 'text';
        } else {
            input.placeholder = 'Номер телефона (11 цифр)';
            input.maxLength = 11;
            input.type = 'tel';
        }
    }

    function updateTransferMethodUI() {
        var cardBtn = document.getElementById('transferCardBtn');
        var phoneBtn = document.getElementById('transferPhoneBtn');
        if (cardBtn) cardBtn.className = transferMethod === 'card' ? 'active' : '';
        if (phoneBtn) phoneBtn.className = transferMethod === 'phone' ? 'active' : '';
    }

    function makeTransfer() {
        var recipient = document.getElementById('transferRecipient').value.replace(/\s/g, '');
        var amount = parseInt(document.getElementById('transferAmount').value);

        if (!recipient) { showToast('Введите номер получателя'); return; }

        var recipientDisplay = '';
        if (transferMethod === 'card') {
            if (recipient.length < 16) { showToast('Введите 16 цифр карты'); return; }
            if (recipient === bankData.cardNumber.replace(/\s/g, '')) { showToast('❌ Нельзя перевести себе'); return; }
            recipientDisplay = 'Карта: ' + recipient;
        } else {
            if (recipient.length < 11) { showToast('Введите 11 цифр телефона'); return; }
            if (recipient === bankData.phone) { showToast('❌ Нельзя перевести себе'); return; }
            recipientDisplay = 'Телефон: ' + recipient;
        }

        if (!amount || amount < 1) { showToast('Введите сумму перевода'); return; }
        if (amount > bankData.balance) { showToast('❌ Недостаточно средств'); return; }

        var now = new Date();
        var timeStr = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
        bankData.history.push({
            type: 'out',
            amount: amount,
            recipient: recipientDisplay,
            time: timeStr
        });

        bankData.balance -= amount;
        saveBankData();
        renderBank();
        showToast('✅ Перевод выполнен! Сумма: ' + amount + ' ₽');
    }

    // ===== ОТКРЫТИЕ/ЗАКРЫТИЕ ПРИЛОЖЕНИЙ =====
    function openStudy() {
        document.getElementById('studyModal').classList.add('active');
        renderStudy();
    }

    function closeStudy() {
        document.getElementById('studyModal').classList.remove('active');
    }

    function openBank() {
        document.getElementById('bankModal').classList.add('active');
        loadBankData();
        renderBank();
    }

    function closeBank() {
        bankData.loggedIn = false;
        saveBankData();
        document.getElementById('bankModal').classList.remove('active');
    }

    // ===== СОБЫТИЯ =====
    document.getElementById('closeStudyBtn').addEventListener('click', closeStudy);
    document.getElementById('closeBankBtn').addEventListener('click', closeBank);
    document.getElementById('closeBookBtn').addEventListener('click', closeBook);

    document.getElementById('studyModal').addEventListener('click', function(e) {
        if (e.target === this) closeStudy();
    });
    document.getElementById('bankModal').addEventListener('click', function(e) {
        if (e.target === this) closeBank();
    });
    document.getElementById('bookModal').addEventListener('click', function(e) {
        if (e.target === this) closeBook();
    });

    // ===== ЗАПУСК =====
    renderStudy();

    setInterval(function() {
        var counter = document.getElementById('daysCounter');
        if (counter) {
            var days = getDaysLeft();
            counter.textContent = days;
            var big = document.querySelector('.days-left-big');
            if (big && !big.textContent.includes('Обучение завершено')) {
                big.textContent = 'Осталось дней: ' + days;
            }
            if (days <= 0) {
                var status = document.querySelector('.status-text');
                if (status) status.textContent = 'Обучение завершено';
            }
        }
    }, 1000);
</script>
</body>
</html>
