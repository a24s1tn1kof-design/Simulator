<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Симулятор</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', system-ui, sans-serif;
            touch-action: manipulation;
            padding: 10px;
        }
        .phone {
            width: 375px;
            max-width: 100%;
            height: 750px;
            background: #0a0a0f;
            border-radius: 40px;
            padding: 18px;
            box-shadow: 0 30px 80px rgba(0,0,0,0.8), inset 0 0 0 2px #2a2a3a;
            position: relative;
            overflow: hidden;
        }
        .phone-screen {
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #0f0f1a 0%, #1a1a2e 100%);
            border-radius: 28px;
            padding: 20px 18px;
            overflow-y: auto;
            position: relative;
            scroll-behavior: smooth;
        }
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #fff;
            font-size: 12px;
            font-weight: 600;
            padding-bottom: 12px;
            border-bottom: 1px solid #1a1a2a;
            margin-bottom: 16px;
        }
        .status-icons { display: flex; gap: 6px; font-size: 13px; align-items: center; }

        .apps-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px 12px;
            margin-top: 20px;
        }
        .app-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            touch-action: manipulation;
            transition: transform 0.15s;
        }
        .app-item:active { transform: scale(0.92); }
        .app-icon {
            width: 62px;
            height: 62px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
        }
        .app-icon.study { background: linear-gradient(135deg, #4facfe, #00f2fe); }
        .app-icon.bank { background: linear-gradient(135deg, #43e97b, #38f9d7); }
        .app-icon.locked { background: linear-gradient(135deg, #2d2d44, #3d3d5c); opacity: 0.5; }
        .app-name { color: #bbb; font-size: 11px; font-weight: 500; text-align: center; }

        .modal {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(12px);
            border-radius: 28px;
            padding: 30px 22px;
            z-index: 100;
            overflow-y: auto;
        }
        .modal.active { display: block; }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .modal-header h2 { color: #fff; font-size: 22px; font-weight: 700; }
        .modal-close {
            background: rgba(255,255,255,0.08);
            border: none;
            color: #fff;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            touch-action: manipulation;
            transition: 0.2s;
        }
        .modal-close:active { transform: scale(0.9); background: rgba(255,0,0,0.2); }

        .profession-list { display: flex; flex-direction: column; gap: 12px; margin-top: 8px; }
        .profession-card {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 16px 18px;
            border: 1px solid rgba(255,255,255,0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.2s;
            cursor: pointer;
        }
        .profession-card:active { transform: scale(0.97); }
        .profession-card .info h3 { color: #fff; font-size: 15px; font-weight: 600; }
        .profession-card .info p { color: #888; font-size: 12px; margin-top: 2px; }
        .profession-card .info .detail { color: #4facfe; font-size: 11px; margin-top: 4px; }

        .profession-btn {
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            border: none;
            color: #fff;
            padding: 8px 18px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            touch-action: manipulation;
            transition: 0.2s;
            box-shadow: 0 4px 15px rgba(79,172,254,0.3);
            white-space: nowrap;
        }
        .profession-btn:active { transform: scale(0.92); }
        .profession-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .empty-bank { text-align: center; padding: 50px 0; color: #555; }
        .empty-bank .big-icon { font-size: 64px; margin-bottom: 16px; }
        .empty-bank p { font-size: 14px; }

        .profession-detail {
            display: none;
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
            padding: 14px 16px;
            margin-top: 10px;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .profession-detail.open { display: block; }
        .profession-detail .row {
            display: flex;
            justify-content: space-between;
            color: #ccc;
            font-size: 13px;
            padding: 4px 0;
        }
        .profession-detail .row .label { color: #888; }
        .profession-detail .row .value { color: #fff; font-weight: 500; }
        .profession-detail .exam-date {
            color: #f5c842;
            font-size: 13px;
            margin-top: 8px;
            text-align: center;
            border-top: 1px solid rgba(255,255,255,0.05);
            padding-top: 8px;
        }

        .selected-profession-block {
            background: rgba(46,204,113,0.1);
            border: 1px solid #2ecc71;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            margin-bottom: 16px;
        }
        .selected-profession-block .prof-name { color: #fff; font-size: 20px; font-weight: 600; }
        .selected-profession-block .prof-desc { color: #aaa; font-size: 13px; margin-top: 4px; }
        .selected-profession-block .status-text { color: #2ecc71; font-size: 13px; margin-top: 8px; }
        .selected-profession-block .days-left-big { color: #4facfe; font-size: 18px; font-weight: 700; margin-top: 6px; }

        .book-btn {
            background: #2ecc71;
            border: none;
            color: #fff;
            padding: 14px 20px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            touch-action: manipulation;
            transition: 0.2s;
            box-shadow: 0 4px 20px rgba(46,204,113,0.4);
            width: 100%;
            margin-top: 16px;
        }
        .book-btn:active { transform: scale(0.96); }

        .book-modal {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.92);
            backdrop-filter: blur(16px);
            border-radius: 28px;
            padding: 30px 22px;
            z-index: 200;
            overflow-y: auto;
        }
        .book-modal.active { display: block; }
        .book-modal .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .book-modal .modal-header h2 { color: #2ecc71; font-size: 20px; font-weight: 700; }
        .book-modal .modal-close {
            background: rgba(255,255,255,0.08);
            border: none;
            color: #fff;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
        }
        .book-content { color: #ddd; font-size: 14px; line-height: 1.6; }
        .book-content .question-block {
            background: rgba(255,255,255,0.04);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 14px;
            border-left: 3px solid #2ecc71;
        }
        .book-content .question-block .q { color: #fff; font-weight: 600; margin-bottom: 6px; }
        .book-content .question-block .a { color: #aaa; }

        .bank-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .bank-card {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 16px;
            border: 1px solid rgba(255,255,255,0.06);
            cursor: pointer;
            transition: 0.2s;
        }
        .bank-card:active { transform: scale(0.96); }
        .bank-card .title { color: #fff; font-size: 15px; font-weight: 600; }
        .bank-card .sub { color: #888; font-size: 12px; margin-top: 4px; }
        .bank-card .amount { color: #f5c842; font-size: 20px; font-weight: 700; margin-top: 6px; }

        .bank-input {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 12px 14px;
            color: #fff;
            font-size: 15px;
            width: 100%;
            outline: none;
        }
        .bank-input::placeholder { color: #555; }
        .bank-input:focus { border-color: #4facfe; }

        .bank-btn {
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            border: none;
            color: #fff;
            padding: 12px 20px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            touch-action: manipulation;
            transition: 0.2s;
            box-shadow: 0 4px 15px rgba(79,172,254,0.3);
            width: 100%;
        }
        .bank-btn:active { transform: scale(0.96); }
        .bank-btn.green { background: linear-gradient(135deg, #2ecc71, #27ae60); box-shadow: 0 4px 15px rgba(46,204,113,0.3); }
        .bank-btn.red { background: linear-gradient(135deg, #e74c3c, #c0392b); box-shadow: 0 4px 15px rgba(231,76,60,0.3); }
        .bank-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        .bank-balance {
            background: rgba(46,204,113,0.1);
            border: 1px solid #2ecc71;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            margin-bottom: 16px;
        }
        .bank-balance .label { color: #888; font-size: 13px; }
        .bank-balance .amount { color: #f5c842; font-size: 32px; font-weight: 700; }

        .bank-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .toast-custom {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.9);
            color: #fff;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 14px;
            border: 1px solid #333;
            backdrop-filter: blur(10px);
            white-space: nowrap;
            z-index: 200;
            transition: opacity 0.3s;
        }

        .phone-screen::-webkit-scrollbar { width: 3px; }
        .phone-screen::-webkit-scrollbar-track { background: transparent; }
        .phone-screen::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
        @media (max-width: 400px) {
            .phone { height: 95vh; border-radius: 28px; padding: 12px; }
            .phone-screen { border-radius: 20px; padding: 14px; }
            .app-icon { width: 54px; height: 54px; font-size: 24px; }
            .apps-grid { gap: 14px 8px; }
        }
    </style>
</head>
<body>
<div class="phone">
    <div class="phone-screen" id="phoneScreen">

        <div class="status-bar">
            <span id="statusTime">12:00</span>
            <div class="status-icons">
                <span>📶</span>
                <span>📶</span>
                <span id="batteryDisplay">🔋 100%</span>
            </div>
        </div>

        <div class="apps-grid">
            <div class="app-item" id="studyAppBtn">
                <div class="app-icon study">📚</div>
                <span class="app-name">Учеба</span>
            </div>
            <div class="app-item" id="bankAppBtn">
                <div class="app-icon bank">🏦</div>
                <span class="app-name">Банк</span>
            </div>
            <div class="app-item">
                <div class="app-icon locked">🔒</div>
                <span class="app-name">Скоро</span>
            </div>
        </div>

        <div class="modal" id="studyModal">
            <div class="modal-header">
                <h2>Учеба</h2>
                <button class="modal-close" id="closeStudyBtn">✕</button>
            </div>
            <div id="studyContent"></div>
        </div>

        <div class="modal" id="bankModal">
            <div class="modal-header">
                <h2>Банк</h2>
                <button class="modal-close" id="closeBankBtn">✕</button>
            </div>
            <div id="bankContent"></div>
        </div>

        <div class="book-modal" id="bookModal">
            <div class="modal-header">
                <h2>📖 Книга для учения</h2>
                <button class="modal-close" id="closeBookBtn">✕</button>
            </div>
            <div class="book-content" id="bookContent"></div>
        </div>

    </div>
</div>
<script>
    // ===== НАСТОЯЩЕЕ ВРЕМЯ =====
    function updateTime() {
        var now = new Date();
        var h = String(now.getHours()).padStart(2, '0');
        var m = String(now.getMinutes()).padStart(2, '0');
        document.getElementById('statusTime').textContent = h + ':' + m;
    }
    updateTime();
    setInterval(updateTime, 5000);

    // ===== НАСТОЯЩАЯ БАТАРЕЯ =====
    function updateBattery() {
        if (navigator.getBattery) {
            navigator.getBattery().then(function(battery) {
                var level = Math.round(battery.level * 100);
                var el = document.getElementById('batteryDisplay');
                el.textContent = '🔋 ' + level + '%';
                if (level < 20) el.style.color = '#e74c3c';
                else if (level < 50) el.style.color = '#f5c842';
                else el.style.color = '#2ecc71';
            }).catch(function() {
                document.getElementById('batteryDisplay').textContent = '🔋 72%';
            });
        } else {
            document.getElementById('batteryDisplay').textContent = '🔋 68%';
        }
    }
    updateBattery();
    setInterval(updateBattery, 5000);

    // ===== УЧЕБА =====
    var professions = [
        { id: 'fsb', name: 'ФСБ', desc: 'Федеральная служба безопасности' },
        { id: 'mchs', name: 'МЧС', desc: 'Спасатель, пожарный' },
        { id: 'medic', name: 'Медик', desc: 'Врач, фельдшер' },
        { id: 'mvd', name: 'МВД', desc: 'Полицейский, следователь' },
        { id: 'teacher', name: 'Учитель', desc: 'Преподаватель, наставник' }
    ];

    var selectedProfession = localStorage.getItem('selectedProfession') || null;
    var startDate = localStorage.getItem('startDate') || null;

    function getDaysLeft() {
        if (!startDate) return 14;
        var start = new Date(startDate);
        var now = new Date();
        var diff = Math.floor((now - start) / (1000 * 60 * 60 * 24));
        var left = 14 - diff;
        return left < 0 ? 0 : left;
    }

    function renderStudy() {
        var content = document.getElementById('studyContent');
        if (selectedProfession) {
            var prof = null;
            for (var i = 0; i < professions.length; i++) {
                if (professions[i].id === selectedProfession) { prof = professions[i]; break; }
            }
            var daysLeft = getDaysLeft();
            content.innerHTML = `
                <div class="selected-profession-block">
                    <div class="prof-name">${prof ? prof.name : ''}</div>
                    <div class="prof-desc">${prof ? prof.desc : ''}</div>
                    <div class="status-text">Профессия выбрана</div>
                    <div class="days-left-big">Осталось дней: ${daysLeft}</div>
                </div>
            `;
            return;
        }

        var html = '<div class="profession-list">';
        for (var j = 0; j < professions.length; j++) {
            var p = professions[j];
            html += `
                <div class="profession-card" onclick="selectProfession('${p.id}')">
                    <div class="info">
                        <h3>${p.name}</h3>
                        <p>${p.desc}</p>
                    </div>
                    <button class="profession-btn">Выбрать</button>
                </div>
            `;
        }
        html += '</div>';
        content.innerHTML = html;
    }

    function selectProfession(id) {
        if (selectedProfession) { showToast('Профессия уже выбрана!'); return; }
        selectedProfession = id;
        startDate = new Date().toISOString();
        localStorage.setItem('selectedProfession', id);
        localStorage.setItem('startDate', startDate);
        renderStudy();
        showToast('✅ Обучение началось!');
    }

    // ===== БАНК =====
    var bankData = {
        registered: false,
        name: '',
        password: '',
        balance: 0,
        deposit: 0,
        depositDate: null,
        credit: 0,
        creditDate: null,
        creditAmount: 0,
        profession: ''
    };

    function loadBankData() {
        try {
            var saved = localStorage.getItem('bankData');
            if (saved) {
                var data = JSON.parse(saved);
                bankData.registered = data.registered || false;
                bankData.name = data.name || '';
                bankData.password = data.password || '';
                bankData.balance = data.balance || 0;
                bankData.deposit = data.deposit || 0;
                bankData.depositDate = data.depositDate || null;
                bankData.credit = data.credit || 0;
                bankData.creditDate = data.creditDate || null;
                bankData.creditAmount = data.creditAmount || 0;
                bankData.profession = data.profession || '';
            }
        } catch(e) {}
    }

    function saveBankData() {
        try {
            localStorage.setItem('bankData', JSON.stringify(bankData));
        } catch(e) {}
    }

    function getProfessionFromStudy() {
        var prof = localStorage.getItem('selectedProfession') || '';
        if (prof) {
            var professionsMap = {
                'fsb': 'ФСБ',
                'mchs': 'МЧС',
                'medic': 'Медик',
                'mvd': 'МВД',
                'teacher': 'Учитель'
            };
            return professionsMap[prof] || prof;
        }
        return '';
    }

    function showToast(text) {
        var old = document.querySelector('.toast-custom');
        if (old) old.remove();
        var toast = document.createElement('div');
        toast.className = 'toast-custom';
        toast.textContent = text;
        document.getElementById('phoneScreen').appendChild(toast);
        setTimeout(function() { toast.remove(); }, 2500);
    }

    // ===== ОТРИСОВКА БАНКА =====
    function renderBank() {
        var content = document.getElementById('bankContent');

        if (!bankData.registered) {
            var prof = getProfessionFromStudy();
            if (!prof) {
                content.innerHTML = `
                    <div style="color:#888;text-align:center;padding:30px 0;">
                        <div style="font-size:48px;margin-bottom:16px;">🏦</div>
                        <p style="font-size:15px;color:#ddd;">Для регистрации в банке</p>
                        <p style="font-size:13px;color:#888;margin-top:6px;">Сначала выберите профессию в учёбе</p>
                        <button class="bank-btn" onclick="closeBank();openStudy();" style="margin-top:16px;">Перейти к учёбе</button>
                    </div>
                `;
                return;
            }

            content.innerHTML = `
                <div style="text-align:center;margin-bottom:20px;">
                    <div style="font-size:48px;">🏦</div>
                    <div style="color:#fff;font-size:18px;font-weight:600;margin-top:8px;">Регистрация</div>
                    <div style="color:#888;font-size:13px;margin-top:4px;">Профессия: ${prof}</div>
                </div>
                <div style="display:flex;flex-direction:column;gap:12px;">
                    <input class="bank-input" id="regName" placeholder="Ваше имя" maxlength="20">
                    <input class="bank-input" id="regPassword" placeholder="Пароль (4 цифры)" type="password" maxlength="4" inputmode="numeric">
                    <button class="bank-btn green" onclick="registerBank()">Зарегистрироваться</button>
                </div>
            `;
            return;
        }

        var prof = getProfessionFromStudy();
        var daysLeft = getDaysLeft();

        content.innerHTML = `
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
                <div style="color:#888;font-size:13px;">👤 ${bankData.name}</div>
                <div style="color:#888;font-size:13px;">${prof || 'Без профессии'}</div>
            </div>

            <div class="bank-balance">
                <div class="label">Баланс</div>
                <div class="amount">${bankData.balance} $</div>
                <div style="color:#888;font-size:11px;margin-top:4px;">До окончания обучения: ${daysLeft} дней</div>
            </div>

            <div class="bank-grid">
                <div class="bank-card" onclick="showDeposit()">
                    <div class="title">💰 Вклад</div>
                    <div class="sub">${bankData.deposit > 0 ? 'Активен: ' + bankData.deposit + ' $' : 'Нет активного вклада'}</div>
                    ${bankData.deposit > 0 ? '<div class="amount" style="font-size:14px;color:#2ecc71;">+10% в день</div>' : ''}
                </div>
                <div class="bank-card" onclick="showCredit()">
                    <div class="title">💳 Кредит</div>
                    <div class="sub">${bankData.credit > 0 ? 'Долг: ' + bankData.credit + ' $' : 'Нет кредита'}</div>
                    ${bankData.credit > 0 ? '<div class="amount" style="font-size:14px;color:#e74c3c;">Осталось: ' + daysLeft + ' дней</div>' : ''}
                </div>
            </div>

            <button class="bank-btn" onclick="showTransfer()" style="margin-top:12px;">📤 Перевод</button>
            <button class="bank-btn red" onclick="logoutBank()" style="margin-top:8px;box-shadow:none;">Выйти</button>
        `;
    }

    // ===== РЕГИСТРАЦИЯ =====
    function registerBank() {
        var name = document.getElementById('regName').value.trim();
        var password = document.getElementById('regPassword').value.trim();

        if (!name) { showToast('Введите имя'); return; }
        if (name.length < 2) { showToast('Имя минимум 2 символа'); return; }
        if (!password || password.length !== 4 || isNaN(password)) {
            showToast('Пароль — 4 цифры');
            return;
        }

        bankData.registered = true;
        bankData.name = name;
        bankData.password = password;
        bankData.balance = 100;
        bankData.profession = getProfessionFromStudy();
        saveBankData();
        renderBank();
        showToast('✅ Регистрация успешна! Получен бонус 100 $');
    }

    // ===== ВКЛАД =====
    function showDeposit() {
        var content = document.getElementById('bankContent');
        var daysLeft = getDaysLeft();

        if (bankData.deposit > 0) {
            var earned = Math.floor(bankData.deposit * 0.1 * (14 - daysLeft));
            content.innerHTML = `
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
                    <button class="bank-btn" onclick="renderBank()" style="width:auto;padding:6px 16px;font-size:13px;">← Назад</button>
                </div>
                <div class="bank-balance">
                    <div class="label">💰 Активный вклад</div>
                    <div class="amount">${bankData.deposit} $</div>
                    <div style="color:#2ecc71;font-size:14px;margin-top:6px;">Доход: +10% в день</div>
                    <div style="color:#888;font-size:13px;margin-top:4px;">Заработано: ${earned} $</div>
                    <div style="color:#888;font-size:12px;margin-top:2px;">Осталось дней: ${daysLeft}</div>
                </div>
                <button class="bank-btn red" onclick="closeDeposit()">Закрыть вклад</button>
            `;
            return;
        }

        content.innerHTML = `
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
                <button class="bank-btn" onclick="renderBank()" style="width:auto;padding:6px 16px;font-size:13px;">← Назад</button>
            </div>
            <div style="color:#fff;font-size:16px;font-weight:600;margin-bottom:12px;">💰 Открыть вклад</div>
            <div style="color:#888;font-size:13px;margin-bottom:12px;">Минимальная сумма: 50 $</div>
            <div style="color:#888;font-size:13px;margin-bottom:12px;">Доход: 10% от суммы каждый день</div>
            <div style="color:#888;font-size:13px;margin-bottom:16px;">Ваш баланс: ${bankData.balance} $</div>
            <input class="bank-input" id="depositAmount" placeholder="Сумма вклада" type="number" min="50">
            <button class="bank-btn green" onclick="openDeposit()" style="margin-top:12px;">Открыть вклад</button>
        `;
    }

    function openDeposit() {
        var amount = parseInt(document.getElementById('depositAmount').value);
        if (!amount || amount < 50) { showToast('Минимальная сумма: 50 $'); return; }
        if (amount > bankData.balance) { showToast('Недостаточно средств'); return; }

        bankData.balance -= amount;
        bankData.deposit = amount;
        bankData.depositDate = new Date().toISOString();
        saveBankData();
        renderBank();
        showToast('✅ Вклад открыт!');
    }

    function closeDeposit() {
        var daysLeft = getDaysLeft();
        var earned = Math.floor(bankData.deposit * 0.1 * (14 - daysLeft));
        var total = bankData.deposit + earned;
        bankData.balance += total;
        bankData.deposit = 0;
        bankData.depositDate = null;
        saveBankData();
        renderBank();
        showToast('💰 Вклад закрыт. Получено: ' + total + ' $');
    }

    // ===== КРЕДИТ =====
    function showCredit() {
        var content = document.getElementById('bankContent');
        var daysLeft = getDaysLeft();

        if (bankData.credit > 0) {
            content.innerHTML = `
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
                    <button class="bank-btn" onclick="renderBank()" style="width:auto;padding:6px 16px;font-size:13px;">← Назад</button>
                </div>
                <div class="bank-balance" style="border-color:#e74c3c;">
                    <div class="label">💳 Активный кредит</div>
                    <div class="amount" style="color:#e74c3c;">${bankData.credit} $</div>
                    <div style="color:#f5c842;font-size:14px;margin-top:6px;">Проценты: +20%</div>
                    <div style="color:#888;font-size:13px;margin-top:4px;">К возврату: ${Math.floor(bankData.credit * 1.2)} $</div>
                    <div style="color:#888;font-size:12px;margin-top:2px;">Осталось дней: ${daysLeft}</div>
                </div>
                <button class="bank-btn green" onclick="payCredit()" ${bankData.balance < Math.floor(bankData.credit * 1.2) ? 'disabled' : ''}>
                    ${bankData.balance >= Math.floor(bankData.credit * 1.2) ? 'Погасить кредит' : 'Недостаточно средств'}
                </button>
            `;
            return;
        }

        content.innerHTML = `
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
                <button class="bank-btn" onclick="renderBank()" style="width:auto;padding:6px 16px;font-size:13px;">← Назад</button>
            </div>
            <div style="color:#fff;font-size:16px;font-weight:600;margin-bottom:12px;">💳 Взять кредит</div>
            <div style="color:#888;font-size:13px;margin-bottom:12px;">Максимальная сумма: ${bankData.balance * 2} $</div>
            <div style="color:#888;font-size:13px;margin-bottom:12px;">Проценты: 20% от суммы</div>
            <div style="color:#888;font-size:13px;margin-bottom:16px;">Срок: до окончания обучения</div>
            <input class="bank-input" id="creditAmount" placeholder="Сумма кредита" type="number" min="10">
            <button class="bank-btn" onclick="takeCredit()" style="margin-top:12px;">Взять кредит</button>
        `;
    }

    function takeCredit() {
        var amount = parseInt(document.getElementById('creditAmount').value);
        if (!amount || amount < 10) { showToast('Минимальная сумма: 10 $'); return; }
        var maxCredit = bankData.balance * 2;
        if (amount > maxCredit) { showToast('Максимальная сумма: ' + maxCredit + ' $'); return; }

        bankData.balance += amount;
        bankData.credit = amount;
        bankData.creditAmount = amount;
        bankData.creditDate = new Date().toISOString();
        saveBankData();
        renderBank();
        showToast('✅ Кредит выдан! Сумма: ' + amount + ' $');
    }

    function payCredit() {
        var total = Math.floor(bankData.credit * 1.2);
        if (bankData.balance < total) { showToast('❌ Недостаточно средств'); return; }

        bankData.balance -= total;
        bankData.credit = 0;
        bankData.creditAmount = 0;
        bankData.creditDate = null;
        saveBankData();
        renderBank();
        showToast('✅ Кредит погашен!');
    }

    // ===== ПЕРЕВОД =====
    function showTransfer() {
        var content = document.getElementById('bankContent');
        content.innerHTML = `
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
                <button class="bank-btn" onclick="renderBank()" style="width:auto;padding:6px 16px;font-size:13px;">← Назад</button>
            </div>
            <div style="color:#fff;font-size:16px;font-weight:600;margin-bottom:12px;">📤 Перевод</div>
            <div style="color:#888;font-size:13px;margin-bottom:16px;">Ваш баланс: ${bankData.balance} $</div>
            <input class="bank-input" id="transferTo" placeholder="Кому перевести (имя)" style="margin-bottom:10px;">
            <input class="bank-input" id="transferAmount" placeholder="Сумма перевода" type="number" min="1">
            <button class="bank-btn green" onclick="makeTransfer()" style="margin-top:12px;">Перевести</button>
            <div style="color:#555;font-size:12px;text-align:center;margin-top:8px;">Сейчас доступен перевод только самому себе</div>
        `;
    }

    function makeTransfer() {
        var to = document.getElementById('transferTo').value.trim();
        var amount = parseInt(document.getElementById('transferAmount').value);

        if (!to) { showToast('Введите имя получателя'); return; }
        if (!amount || amount < 1) { showToast('Введите сумму'); return; }
        if (amount > bankData.balance) { showToast('Недостаточно средств'); return; }

        bankData.balance -= amount;
        saveBankData();
        renderBank();
        showToast('✅ Перевод выполнен! Сумма: ' + amount + ' $');
    }

    // ===== ВЫХОД =====
    function logoutBank() {
        bankData.registered = false;
        bankData.name = '';
        bankData.password = '';
        saveBankData();
        renderBank();
        showToast('👋 Вы вышли из банка');
    }

    // ===== ОТКРЫТИЕ/ЗАКРЫТИЕ ПРИЛОЖЕНИЙ =====
    function openStudy() {
        document.getElementById('studyModal').classList.add('active');
        renderStudy();
    }

    function closeStudy() {
        document.getElementById('studyModal').classList.remove('active');
    }

    function openBank() {
        document.getElementById('bankModal').classList.add('active');
        loadBankData();
        renderBank();
    }

    function closeBank() {
        document.getElementById('bankModal').classList.remove('active');
    }

    // ===== НАЗНАЧАЕМ СОБЫТИЯ =====
    document.getElementById('studyAppBtn').addEventListener('click', openStudy);
    document.getElementById('bankAppBtn').addEventListener('click', openBank);
    document.getElementById('closeStudyBtn').addEventListener('click', closeStudy);
    document.getElementById('closeBankBtn').addEventListener('click', closeBank);

    document.getElementById('studyModal').addEventListener('click', function(e) {
        if (e.target === this) closeStudy();
    });
    document.getElementById('bankModal').addEventListener('click', function(e) {
        if (e.target === this) closeBank();
    });

    // ===== ЗАПУСК =====
    renderStudy();
</script>
</body>
    </html>
