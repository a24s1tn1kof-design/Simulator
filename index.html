<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Симулятор</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', system-ui, sans-serif;
            touch-action: manipulation;
            padding: 10px;
        }
        .phone {
            width: 375px;
            max-width: 100%;
            height: 750px;
            background: #0a0a0f;
            border-radius: 40px;
            padding: 18px;
            box-shadow: 0 30px 80px rgba(0,0,0,0.8), inset 0 0 0 2px #2a2a3a;
            position: relative;
            overflow: hidden;
        }
        .phone-screen {
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #0f0f1a 0%, #1a1a2e 100%);
            border-radius: 28px;
            padding: 20px 18px;
            overflow-y: auto;
            position: relative;
            scroll-behavior: smooth;
        }
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #fff;
            font-size: 12px;
            font-weight: 600;
            padding-bottom: 12px;
            border-bottom: 1px solid #1a1a2a;
            margin-bottom: 16px;
        }
        .status-icons { display: flex; gap: 6px; font-size: 13px; align-items: center; }

        .apps-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px 12px;
            margin-top: 20px;
        }
        .app-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            touch-action: manipulation;
            transition: transform 0.15s;
        }
        .app-item:active { transform: scale(0.92); }
        .app-icon {
            width: 62px;
            height: 62px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
        }
        .app-icon.study { background: linear-gradient(135deg, #4facfe, #00f2fe); }
        .app-icon.bank { background: linear-gradient(135deg, #43e97b, #38f9d7); }
        .app-icon.locked { background: linear-gradient(135deg, #2d2d44, #3d3d5c); opacity: 0.5; }
        .app-name { color: #bbb; font-size: 11px; font-weight: 500; text-align: center; }

        .modal {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(12px);
            border-radius: 28px;
            padding: 30px 22px;
            z-index: 100;
            overflow-y: auto;
        }
        .modal.active { display: block; }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .modal-header h2 { color: #fff; font-size: 22px; font-weight: 700; }
        .modal-close {
            background: rgba(255,255,255,0.08);
            border: none;
            color: #fff;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            touch-action: manipulation;
            transition: 0.2s;
        }
        .modal-close:active { transform: scale(0.9); background: rgba(255,0,0,0.2); }

        .profession-list { display: flex; flex-direction: column; gap: 12px; margin-top: 8px; }
        .profession-card {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 16px 18px;
            border: 1px solid rgba(255,255,255,0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.2s;
            cursor: pointer;
        }
        .profession-card:active { transform: scale(0.97); }
        .profession-card .info h3 { color: #fff; font-size: 15px; font-weight: 600; }
        .profession-card .info p { color: #888; font-size: 12px; margin-top: 2px; }
        .profession-card .info .detail { color: #4facfe; font-size: 11px; margin-top: 4px; }

        .profession-btn {
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            border: none;
            color: #fff;
            padding: 8px 18px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            touch-action: manipulation;
            transition: 0.2s;
            box-shadow: 0 4px 15px rgba(79,172,254,0.3);
            white-space: nowrap;
        }
        .profession-btn:active { transform: scale(0.92); }
        .profession-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .empty-bank { text-align: center; padding: 50px 0; color: #555; }
        .empty-bank .big-icon { font-size: 64px; margin-bottom: 16px; }
        .empty-bank p { font-size: 14px; }

        .profession-detail {
            display: none;
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
            padding: 14px 16px;
            margin-top: 10px;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .profession-detail.open { display: block; }
        .profession-detail .row {
            display: flex;
            justify-content: space-between;
            color: #ccc;
            font-size: 13px;
            padding: 4px 0;
        }
        .profession-detail .row .label { color: #888; }
        .profession-detail .row .value { color: #fff; font-weight: 500; }
        .profession-detail .exam-date {
            color: #f5c842;
            font-size: 13px;
            margin-top: 8px;
            text-align: center;
            border-top: 1px solid rgba(255,255,255,0.05);
            padding-top: 8px;
        }

        .selected-profession-block {
            background: rgba(46,204,113,0.1);
            border: 1px solid #2ecc71;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            margin-bottom: 16px;
        }
        .selected-profession-block .prof-name { color: #fff; font-size: 20px; font-weight: 600; }
        .selected-profession-block .prof-desc { color: #aaa; font-size: 13px; margin-top: 4px; }
        .selected-profession-block .status-text { color: #2ecc71; font-size: 13px; margin-top: 8px; }
        .selected-profession-block .days-left-big { color: #4facfe; font-size: 18px; font-weight: 700; margin-top: 6px; }

        .book-btn {
            background: #2ecc71;
            border: none;
            color: #fff;
            padding: 14px 20px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            touch-action: manipulation;
            transition: 0.2s;
            box-shadow: 0 4px 20px rgba(46,204,113,0.4);
            width: 100%;
            margin-top: 16px;
        }
        .book-btn:active { transform: scale(0.96); }

        .book-modal {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.92);
            backdrop-filter: blur(16px);
            border-radius: 28px;
            padding: 30px 22px;
            z-index: 200;
            overflow-y: auto;
        }
        .book-modal.active { display: block; }
        .book-modal .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .book-modal .modal-header h2 { color: #2ecc71; font-size: 20px; font-weight: 700; }
        .book-modal .modal-close {
            background: rgba(255,255,255,0.08);
            border: none;
            color: #fff;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
        }
        .book-content { color: #ddd; font-size: 14px; line-height: 1.6; }
        .book-content .question-block {
            background: rgba(255,255,255,0.04);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 14px;
            border-left: 3px solid #2ecc71;
        }
        .book-content .question-block .q { color: #fff; font-weight: 600; margin-bottom: 6px; }
        .book-content .question-block .a { color: #aaa; }

        .phone-screen::-webkit-scrollbar { width: 3px; }
        .phone-screen::-webkit-scrollbar-track { background: transparent; }
        .phone-screen::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
        @media (max-width: 400px) {
            .phone { height: 95vh; border-radius: 28px; padding: 12px; }
            .phone-screen { border-radius: 20px; padding: 14px; }
            .app-icon { width: 54px; height: 54px; font-size: 24px; }
            .apps-grid { gap: 14px 8px; }
        }
    </style>
</head>
<body>
<div class="phone">
    <div class="phone-screen" id="phoneScreen">

        <!-- СТАТУС-БАР -->
        <div class="status-bar">
            <span id="statusTime">12:00</span>
            <div class="status-icons">
                <span>📶</span>
                <span>📶</span>
                <span id="batteryDisplay">🔋 100%</span>
            </div>
        </div>

        <!-- ПРИЛОЖЕНИЯ -->
        <div class="apps-grid">
            <div class="app-item" id="studyAppBtn">
                <div class="app-icon study">📚</div>
                <span class="app-name">Учеба</span>
            </div>
            <div class="app-item" id="bankAppBtn">
                <div class="app-icon bank">🏦</div>
                <span class="app-name">Банк</span>
            </div>
            <div class="app-item">
                <div class="app-icon locked">🔒</div>
                <span class="app-name">Скоро</span>
            </div>
        </div>

        <!-- МОДАЛКА УЧЕБА -->
        <div class="modal" id="studyModal">
            <div class="modal-header">
                <h2>Учеба</h2>
                <button class="modal-close" id="closeStudyBtn">✕</button>
            </div>
            <div id="studyContent"></div>
        </div>

        <!-- МОДАЛКА БАНК -->
        <div class="modal" id="bankModal">
            <div class="modal-header">
                <h2>Банк</h2>
                <button class="modal-close" id="closeBankBtn">✕</button>
            </div>
            <div class="empty-bank">
                <div class="big-icon">🏦</div>
                <p style="color:#888;font-size:15px;font-weight:500;">Банковский отдел</p>
                <p style="color:#555;font-size:12px;margin-top:6px;">В разработке...</p>
            </div>
        </div>

        <!-- МОДАЛКА КНИГА -->
        <div class="book-modal" id="bookModal">
            <div class="modal-header">
                <h2>📖 Книга для учения</h2>
                <button class="modal-close" id="closeBookBtn">✕</button>
            </div>
            <div class="book-content" id="bookContent"></div>
        </div>

    </div>
    </div>
    <script>
    // ===== НАСТОЯЩЕЕ ВРЕМЯ =====
    function updateTime() {
        var now = new Date();
        var h = String(now.getHours()).padStart(2, '0');
        var m = String(now.getMinutes()).padStart(2, '0');
        document.getElementById('statusTime').textContent = h + ':' + m;
    }
    updateTime();
    setInterval(updateTime, 5000);

    // ===== НАСТОЯЩАЯ БАТАРЕЯ =====
    function updateBattery() {
        if (navigator.getBattery) {
            navigator.getBattery().then(function(battery) {
                var level = Math.round(battery.level * 100);
                var el = document.getElementById('batteryDisplay');
                el.textContent = '🔋 ' + level + '%';
                if (level < 20) el.style.color = '#e74c3c';
                else if (level < 50) el.style.color = '#f5c842';
                else el.style.color = '#2ecc71';
            }).catch(function() {
                document.getElementById('batteryDisplay').textContent = '🔋 72%';
            });
        } else {
            document.getElementById('batteryDisplay').textContent = '🔋 68%';
        }
    }
    updateBattery();
    setInterval(updateBattery, 5000);

    // ===== ПРОФЕССИИ С РАЗВЁРНУТЫМИ ВОПРОСАМИ (по 5 на профессию) =====
    var professions = [
        { id: 'fsb', name: 'ФСБ', desc: 'Федеральная служба безопасности', trainingTime: 14, examDate: 'Экзамен: 7-й и 14-й день',
            questions: [
                { q: 'В торговом центре неизвестные открыли стрельбу, слышны взрывы, люди в панике бегают. Вы сотрудник ФСБ. Какие номера набрать и как организовать эвакуацию?', a: 'Набрать 112, 102 и 101. Немедленно начать координацию с охраной ТЦ: перекрыть выходы, направить людей к ближайшим эвакуационным выходам, избегая мест стрельбы. Организовать группы по 5-10 человек, назначить старших. Укрыть раненых в безопасных местах. Оценить обстановку, доложить руководству.' },
                { q: 'Вы получили анонимное сообщение о заложенной бомбе в вашем учебном заведении. Вы сотрудник ФСБ. Ваши действия?', a: 'Набрать 112, 102, 101. Не паниковать, немедленно сообщить руководству и охране. Начать эвакуацию по заранее отработанному плану: выводить людей поэтапно, не создавая давки. Проверить все подозрительные места, оцепить здание, дождаться прибытия сапёров. Не допускать паники, вести переговоры с персоналом и учениками.' },
                { q: 'Вы заметили подозрительного человека, который фотографирует военные объекты или здания госучреждений. Вы сотрудник ФСБ. Что делать?', a: 'Запомнить приметы человека (одежда, рост, цвет волос, особые приметы), номер машины, если есть. Немедленно сообщить по номеру 102 или 112. Установить наблюдение, не теряя из виду подозреваемого. При необходимости задержать, действуя по инструкции. Обеспечить сохранность улик.' },
                { q: 'Во время массового мероприятия (концерт, митинг) началась давка, люди паникуют. Вы сотрудник ФСБ. Как действовать?', a: 'Набрать 112, 102, 101. Использовать громкоговорители для управления толпой, указать направления эвакуации. Организовать группы по 10-15 человек, назначить ответственных. Обеспечить проход для скорой помощи. Эвакуировать раненых, оказать первую помощь.' },
                { q: 'Вы обнаружили подозрительный предмет в общественном транспорте (метро, автобус). Вы сотрудник ФСБ. Ваши действия?', a: 'Набрать 112, 102, 101. Остановить движение транспорта, объявить об эвакуации, вывести людей на безопасное расстояние (100-200 метров). Не трогать предмет, оцепить зону, дождаться сапёров. Проверить камеры наблюдения для выявления подозреваемого.' }
            ]
        },
        { id: 'mchs', name: 'МЧС', desc: 'Спасатель, пожарный', trainingTime: 14, examDate: 'Экзамен: 7-й и 14-й день',
            questions: [
                { q: 'Произошло землетрясение силой 7 баллов. Вы спасатель МЧС. Как действовать и какие номера набрать?', a: 'Набрать 112 и 101. Немедленно выехать на место, оценить разрушения. Организовать поисково-спасательные работы, использовать специальное оборудование. Оказать первую помощь пострадавшим, эвакуировать людей из-под завалов. Координировать действия с полицией и медиками.' },
                { q: 'Вы обнаружили возгорание в многоквартирном доме на 3-м этаже, огонь быстро распространяется. Вы спасатель МЧС. Что делать?', a: 'Набрать 112, 101. Немедленно приступить к эвакуации жильцов: выводить людей по лестницам, не допуская паники. Использовать средства защиты (маски, огнетушители). Организовать тушение пожара, перекрыть газ и электричество. Обеспечить безопасность места происшествия.' },
                { q: 'Вы стали свидетелем ДТП с пострадавшими, есть угроза возгорания. Вы спасатель МЧС. Какие номера набрать и как помочь?', a: 'Набрать 112, 101, 103. Обесточить машину, если возможно. Не передвигать пострадавших без необходимости, оказать первую помощь. Использовать огнетушитель при возгорании. Обеспечить безопасность места ДТП, выставить знак аварийной остановки.' },
                { q: 'Во время наводнения люди оказались на крышах домов. Вы спасатель МЧС. Как действовать?', a: 'Набрать 112, 101. Использовать лодки для эвакуации людей, обеспечить средства спасения (спасательные жилеты, верёвки). Организовать пункты временного размещения. Оценить уровень воды, предотвратить панику.' },
                { q: 'В лесу заблудилась группа туристов. Вы спасатель МЧС. Какие номера набрать и как организовать поиск?', a: 'Набрать 112, 101. Координировать поисково-спасательную операцию, использовать GPS-трекеры и дроны. Разделить группу на отряды, прочесать местность по квадратам. Организовать связь с заблудившимися, дать инструкции.' }
            ]
        },
        { id: 'medic', name: 'Медик', desc: 'Врач, фельдшер', trainingTime: 14, examDate: 'Экзамен: 7-й и 14-й день',
            questions: [
                { q: 'У человека внезапно остановилось сердце. Вы врач скорой помощи. Что делать и какой номер набрать?', a: 'Набрать 103 или 112. Немедленно начать сердечно-легочную реанимацию: положить пострадавшего на твёрдую поверхность, проверить дыхание, сделать 30 компрессий грудной клетки глубиной 5-6 см с частотой 100-120 в минуту, затем 2 искусственных вдоха. Продолжать до приезда скорой помощи или появления признаков жизни.' },
                { q: 'Вы видите человека с признаками инсульта: асимметрия лица, нарушение речи, слабость в руке. Вы врач. Что делать?', a: 'Набрать 103 или 112. Усадить или уложить пострадавшего с приподнятой головой. Не давать еду, воду и лекарства. Засечь время начала симптомов. Провести быстрый осмотр, стабилизировать состояние до приезда бригады.' },
                { q: 'Ребёнок подавился едой и не может дышать, синеет. Вы врач. Что делать и какой номер набрать?', a: 'Набрать 103 или 112. Встать позади ребёнка, обхватить его руками, наклонить вперёд, нанести 5 резких ударов между лопатками. Если не помогает — выполнить 5 компрессий в область живота (приём Геймлиха). Если ребёнок потерял сознание — начать СЛР.' },
                { q: 'Вы стали свидетелем массового отравления в столовой. Вы врач. Как действовать?', a: 'Набрать 103 или 112. Оценить состояние пострадавших, отделить лёгкие случаи от тяжёлых. Организовать пункт первой помощи, провести промывание желудка. Эвакуировать тяжёлых больных, провести дезинфекцию места происшествия.' },
                { q: 'У человека открытый перелом ноги после падения с высоты. Вы врач. Что делать?', a: 'Набрать 103 или 112. Не двигать конечность, наложить шину из подручных средств. Остановить кровотечение, если есть. Обезболить (если есть препараты). Зафиксировать конечность, дождаться скорой помощи.' }
            ]
        },
        { id: 'mvd', name: 'МВД', desc: 'Полицейский, следователь', trainingTime: 14, examDate: 'Экзамен: 7-й и 14-й день',
            questions: [
                { q: 'Вы стали свидетелем уличного ограбления с применением оружия. Вы сотрудник полиции. Какие номера набрать и как действовать?', a: 'Набрать 102 или 112. Сообщить приметы преступников (рост, одежда, цвет волос), направление их движения, номер машины, если есть. Оценить угрозу, принять меры к задержанию, если есть возможность. Организовать оцепление места происшествия, опросить свидетелей.' },
                { q: 'Вы нашли подозрительный предмет в автобусе — бесхозный рюкзак с торчащими проводами. Вы сотрудник полиции. Что делать?', a: 'Набрать 102 или 112. Остановить автобус, вывести людей, оградить зону 100 метров. Не трогать предмет, дождаться сапёров. Проверить камеры наблюдения, опросить водителя и пассажиров.' },
                { q: 'Вы получили сообщение о готовящемся теракте в ТЦ через мессенджер. Вы сотрудник полиции. Ваши действия?', a: 'Набрать 102 или 112. Не распространять информацию, чтобы не создавать панику. Немедленно передать сообщение в дежурную часть. Усилить патрулирование, проверить камеры наблюдения. При необходимости начать эвакуацию.' },
                { q: 'Во время патрулирования вы заметили драку с участием несовершеннолетних. Вы сотрудник полиции. Как действовать?', a: 'Набрать 102 или 112. Разнять участников, не применяя силу (если нет угрозы). Провести беседу, выяснить причины. Вызвать родителей, при необходимости — инспектора по делам несовершеннолетних.' },
                { q: 'Вы стали свидетелем незаконной уличной торговли оружием. Вы сотрудник полиции. Что делать?', a: 'Набрать 102 или 112. Оценить обстановку, вызвать подкрепление. Зафиксировать факт торговли (фото, видео). Не вступать в конфликт без поддержки. После прибытия подкрепления — задержать.' }
            ]
        },
        { id: 'teacher', name: 'Учитель', desc: 'Преподаватель, наставник', trainingTime: 14, examDate: 'Экзамен: 7-й и 14-й день',
            questions: [
                { q: 'В классе во время урока началась паника из-за сообщения о стрельбе в школе. Вы учитель. Какие номера набрать и как успокоить детей?', a: 'Набрать 112 или 102. Не паниковать самому, успокоить учеников, закрыть двери, выключить свет, заблокировать дверь стульями. Поддерживать тишину, связаться с администрацией. Быть готовым действовать по команде.' },
                { q: 'Вы стали свидетелем буллинга между учениками, один из них угрожает ножом. Вы учитель. Что делать и какой номер набрать?', a: 'Набрать 102 или 112. Немедленно вмешаться, развести учеников. Успокоить агрессора, вызвать администрацию. Провести беседу с классом, сообщить родителям, предложить психологическую помощь.' },
                { q: 'Во время экскурсии один из учеников потерялся в лесу. Вы учитель. Какие номера набрать и как организовать поиск?', a: 'Набрать 112 или 101 (МЧС) и 102 (полиция). Успокоить остальных детей, оставить их с другим взрослым. Начать поиск по маршруту, использовать GPS-трекер на телефоне. Сообщить администрации, не создавать панику.' },
                { q: 'На перемене ученик упал и ударился головой, потерял сознание. Вы учитель. Что делать?', a: 'Набрать 103 или 112. Уложить ученика на бок, проверить пульс и дыхание. Вызвать скорую помощь, школьного медработника. Не давать воды, не двигать пострадавшего без необходимости.' },
                { q: 'Вы заметили, что ученик принёс в школу опасный предмет (нож, взрывоопасные вещества). Вы учитель. Ваши действия?', a: 'Набрать 102 или 112. Немедленно изъять предмет, вызвать полицию и родителей. Провести беседу с учеником, проверить рюкзак (в присутствии директора). Обеспечить безопасность других учеников.' }
            ]
        }
    ];

    var selectedProfession = localStorage.getItem('selectedProfession') || null;
    var startDate = localStorage.getItem('startDate') || null;
    var openedDetail = null;

    function getDaysLeft() {
        if (!startDate) return 14;
        var start = new Date(startDate);
        var now = new Date();
        var diff = Math.floor((now - start) / (1000 * 60 * 60 * 24));
        var left = 14 - diff;
        return left < 0 ? 0 : left;
    }

    function getDaysPassed() {
        if (!startDate) return 0;
        var start = new Date(startDate);
        var now = new Date();
        return Math.floor((now - start) / (1000 * 60 * 60 * 24));
    }

    function renderStudy() {
        var content = document.getElementById('studyContent');
        var prof = null;
        if (selectedProfession) {
            for (var i = 0; i < professions.length; i++) {
                if (professions[i].id === selectedProfession) { prof = professions[i]; break; }
            }
        }

        if (selectedProfession && prof) {
            var daysLeft = getDaysLeft();
            var daysPassed = getDaysPassed();
            var finished = daysLeft <= 0;

            var html = `
                <div class="selected-profession-block">
                    <div class="prof-name">${prof.name}</div>
                    <div class="prof-desc">${prof.desc}</div>
                    <div class="status-text">${finished ? 'Обучение завершено' : 'Профессия выбрана'}</div>
                    <div class="days-left-big">${finished ? '✅ Обучение завершено' : 'Осталось дней: ' + daysLeft}</div>
                    <div style="color:#888;font-size:12px;margin-top:4px;">${finished ? 'Вы успешно освоили профессию' : 'День ' + Math.min(daysPassed, 14) + ' из 14'}</div>
                </div>
                <div class="profession-detail open">
                    <div class="row"><span class="label">Время обучения</span><span class="value">${prof.trainingTime} дней</span></div>
                    <div class="row"><span class="label">Экзамены</span><span class="value">${prof.examDate}</span></div>
                    <div class="row"><span class="label">Осталось дней</span><span class="value" id="daysCounter">${finished ? 0 : daysLeft}</span></div>
                    <div class="exam-date">${finished ? 'Обучение завершено' : 'Вы проходите обучение по этой профессии'}</div>
                </div>
                <button class="book-btn" onclick="openBook()">📖 Книга для учения</button>
            `;
            content.innerHTML = html;
            return;
        }

        var html = '<div class="profession-list">';
        for (var j = 0; j < professions.length; j++) {
            var p = professions[j];
            var isOpen = (openedDetail === p.id);
            html += `
                <div class="profession-card" onclick="toggleDetail('${p.id}')">
                    <div class="info">
                        <h3>${p.name}</h3>
                        <p>${p.desc}</p>
                        <div class="detail">Нажмите для выбора</div>
                    </div>
                    <button class="profession-btn" onclick="event.stopPropagation(); selectProfession('${p.id}')">Выбрать</button>
                </div>
                <div class="profession-detail ${isOpen ? 'open' : ''}" id="detail-${p.id}">
                    <div class="row"><span class="label">Время обучения</span><span class="value">${p.trainingTime} дней</span></div>
                    <div class="row"><span class="label">Экзамены</span><span class="value">${p.examDate}</span></div>
                    <div class="days-left">Выберите профессию для начала обучения</div>
                    <div class="exam-date">Длительность обучения: 14 дней</div>
                </div>
            `;
        }
        html += '</div>';
        content.innerHTML = html;
    }

    function renderBook() {
        var prof = null;
        for (var i = 0; i < professions.length; i++) {
            if (professions[i].id === selectedProfession) { prof = professions[i]; break; }
        }
        if (!prof) { document.getElementById('bookContent').innerHTML = '<div style="color:#888;">Нет вопросов</div>'; return; }

        var html = '';
        for (var j = 0; j < prof.questions.length; j++) {
            var q = prof.questions[j];
            html += `
                <div class="question-block">
                    <div class="q">❓ ${q.q}</div>
                    <div class="a">${q.a}</div>
                </div>
            `;
        }
        document.getElementById('bookContent').innerHTML = html;
    }

    function toggleDetail(id) {
        openedDetail = (openedDetail === id) ? null : id;
        renderStudy();
    }

    function selectProfession(id) {
        if (selectedProfession) { alert('Профессия уже выбрана!'); return; }
        selectedProfession = id;
        startDate = new Date().toISOString();
        localStorage.setItem('selectedProfession', id);
        localStorage.setItem('startDate', startDate);
        renderStudy();
    }

    function openBook() {
        document.getElementById('bookModal').classList.add('active');
        renderBook();
    }

    function closeBook() {
        document.getElementById('bookModal').classList.remove('active');
    }

    // ===== ОТКРЫТИЕ ПРИЛОЖЕНИЙ =====
    function openStudy() {
        document.getElementById('studyModal').classList.add('active');
        renderStudy();
    }

    function closeStudy() {
        document.getElementById('studyModal').classList.remove('active');
    }

    function openBank() {
        document.getElementById('bankModal').classList.add('active');
    }

    function closeBank() {
        document.getElementById('bankModal').classList.remove('active');
    }

    // ===== НАЗНАЧАЕМ СОБЫТИЯ =====
    document.getElementById('studyAppBtn').addEventListener('click', openStudy);
    document.getElementById('bankAppBtn').addEventListener('click', openBank);
    document.getElementById('closeStudyBtn').addEventListener('click', closeStudy);
    document.getElementById('closeBankBtn').addEventListener('click', closeBank);
    document.getElementById('closeBookBtn').addEventListener('click', closeBook);

    document.getElementById('studyModal').addEventListener('click', function(e) {
        if (e.target === this) closeStudy();
    });
    document.getElementById('bankModal').addEventListener('click', function(e) {
        if (e.target === this) closeBank();
    });
    document.getElementById('bookModal').addEventListener('click', function(e) {
        if (e.target === this) closeBook();
    });

    // ===== ЗАПУСК =====
    renderStudy();

    setInterval(function() {
        var counter = document.getElementById('daysCounter');
        if (counter) {
            var days = getDaysLeft();
            counter.textContent = days;
            var big = document.querySelector('.days-left-big');
            if (big && !big.textContent.includes('Обучение завершено')) {
                big.textContent = 'Осталось дней: ' + days;
            }
            if (days <= 0) {
                var status = document.querySelector('.status-text');
                if (status) status.textContent = 'Обучение завершено';
            }
        }
    }, 1000);
</script>
</body>
</html>
