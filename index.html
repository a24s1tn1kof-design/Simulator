<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Симулятор</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', system-ui, sans-serif;
            touch-action: manipulation;
            padding: 10px;
        }
        .phone {
            width: 375px;
            max-width: 100%;
            height: 750px;
            background: #0a0a0f;
            border-radius: 40px;
            padding: 18px;
            box-shadow: 0 30px 80px rgba(0,0,0,0.8), inset 0 0 0 2px #2a2a3a;
            position: relative;
            overflow: hidden;
        }
        .phone-screen {
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #0f0f1a 0%, #1a1a2e 100%);
            border-radius: 28px;
            padding: 20px 18px;
            overflow-y: auto;
            position: relative;
            scroll-behavior: smooth;
        }
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #fff;
            font-size: 12px;
            font-weight: 600;
            padding-bottom: 12px;
            border-bottom: 1px solid #1a1a2a;
            margin-bottom: 16px;
        }
        .status-icons { display: flex; gap: 6px; font-size: 13px; align-items: center; }
        .battery-level.low { color: #e74c3c; }
        .battery-level.medium { color: #f5c842; }

        .apps-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px 12px;
            margin-top: 20px;
        }
        .app-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            touch-action: manipulation;
            transition: transform 0.15s;
        }
        .app-item:active { transform: scale(0.92); }
        .app-icon {
            width: 62px;
            height: 62px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
        }
        .app-icon.study { background: linear-gradient(135deg, #4facfe, #00f2fe); }
        .app-icon.bank { background: linear-gradient(135deg, #43e97b, #38f9d7); }
        .app-icon.locked { background: linear-gradient(135deg, #2d2d44, #3d3d5c); opacity: 0.5; }
        .app-name { color: #bbb; font-size: 11px; font-weight: 500; text-align: center; }

        .modal {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(12px);
            border-radius: 28px;
            padding: 30px 22px;
            z-index: 100;
            overflow-y: auto;
        }
        .modal.active { display: block; }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .modal-header h2 { color: #fff; font-size: 22px; font-weight: 700; }
        .modal-close {
            background: rgba(255,255,255,0.08);
            border: none;
            color: #fff;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            touch-action: manipulation;
            transition: 0.2s;
        }
        .modal-close:active { transform: scale(0.9); background: rgba(255,0,0,0.2); }

        .profession-list { display: flex; flex-direction: column; gap: 12px; margin-top: 8px; }
        .profession-card {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 16px 18px;
            border: 1px solid rgba(255,255,255,0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.2s;
            cursor: pointer;
        }
        .profession-card:active { transform: scale(0.97); }
        .profession-card .info h3 { color: #fff; font-size: 15px; font-weight: 600; }
        .profession-card .info p { color: #888; font-size: 12px; margin-top: 2px; }
        .profession-card .info .detail {
            color: #4facfe;
            font-size: 11px;
            margin-top: 4px;
        }

        .profession-btn {
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            border: none;
            color: #fff;
            padding: 8px 18px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            touch-action: manipulation;
            transition: 0.2s;
            box-shadow: 0 4px 15px rgba(79,172,254,0.3);
            white-space: nowrap;
        }
        .profession-btn:active { transform: scale(0.92); }
        .profession-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .empty-bank { text-align: center; padding: 50px 0; color: #555; }
        .empty-bank .big-icon { font-size: 64px; margin-bottom: 16px; }
        .empty-bank p { font-size: 14px; }

        .profession-detail {
            display: none;
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
            padding: 14px 16px;
            margin-top: 10px;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .profession-detail.open { display: block; }
        .profession-detail .row {
            display: flex;
            justify-content: space-between;
            color: #ccc;
            font-size: 13px;
            padding: 4px 0;
        }
        .profession-detail .row .label { color: #888; }
        .profession-detail .row .value { color: #fff; font-weight: 500; }
        .profession-detail .exam-date {
            color: #f5c842;
            font-size: 13px;
            margin-top: 8px;
            text-align: center;
            border-top: 1px solid rgba(255,255,255,0.05);
            padding-top: 8px;
        }
        .profession-detail .days-left {
            color: #4facfe;
            font-size: 15px;
            font-weight: 700;
            text-align: center;
            margin-top: 6px;
        }

        .selected-profession-block {
            background: rgba(46,204,113,0.1);
            border: 1px solid #2ecc71;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            margin-bottom: 16px;
        }
        .selected-profession-block .prof-name {
            color: #fff;
            font-size: 20px;
            font-weight: 600;
        }
        .selected-profession-block .prof-desc {
            color: #aaa;
            font-size: 13px;
            margin-top: 4px;
        }
        .selected-profession-block .status-text {
            color: #2ecc71;
            font-size: 13px;
            margin-top: 8px;
        }
        .selected-profession-block .days-left-big {
            color: #4facfe;
            font-size: 18px;
            font-weight: 700;
            margin-top: 6px;
        }

        /* Книга для учения */
        .book-btn {
            background: #2ecc71;
            border: none;
            color: #fff;
            padding: 14px 20px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            touch-action: manipulation;
            transition: 0.2s;
            box-shadow: 0 4px 20px rgba(46,204,113,0.4);
            width: 100%;
            margin-top: 16px;
        }
        .book-btn:active { transform: scale(0.96); }

        .book-modal {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.92);
            backdrop-filter: blur(16px);
            border-radius: 28px;
            padding: 30px 22px;
            z-index: 200;
            overflow-y: auto;
        }
        .book-modal.active { display: block; }
        .book-modal .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .book-modal .modal-header h2 {
            color: #2ecc71;
            font-size: 20px;
            font-weight: 700;
        }
        .book-modal .modal-close {
            background: rgba(255,255,255,0.08);
            border: none;
            color: #fff;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
        }
        .book-content {
            color: #ddd;
            font-size: 14px;
            line-height: 1.6;
        }
        .book-content .question-block {
            background: rgba(255,255,255,0.04);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 14px;
            border-left: 3px solid #2ecc71;
        }
        .book-content .question-block .q {
            color: #fff;
            font-weight: 600;
            margin-bottom: 6px;
        }
        .book-content .question-block .a {
            color: #aaa;
        }
        .book-content .question-block .a strong {
            color: #2ecc71;
            font-weight: 600;
        }

        .phone-screen::-webkit-scrollbar { width: 3px; }
        .phone-screen::-webkit-scrollbar-track { background: transparent; }
        .phone-screen::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
        @media (max-width: 400px) {
            .phone { height: 95vh; border-radius: 28px; padding: 12px; }
            .phone-screen { border-radius: 20px; padding: 14px; }
            .app-icon { width: 54px; height: 54px; font-size: 24px; }
            .apps-grid { gap: 14px 8px; }
        }
    </style>
</head>
<body>
<div class="phone">
    <div class="phone-screen" id="phoneScreen">

        <!-- СТАТУС-БАР -->
        <div class="status-bar">
            <span id="statusTime">12:00</span>
            <div class="status-icons">
                <span>📶</span>
                <span>📶</span>
                <span id="batteryDisplay">🔋 100%</span>
            </div>
        </div>

        <!-- ПРИЛОЖЕНИЯ -->
        <div class="apps-grid">
            <div class="app-item" onclick="openStudy()">
                <div class="app-icon study">📚</div>
                <span class="app-name">Учеба</span>
            </div>
            <div class="app-item" onclick="openBank()">
                <div class="app-icon bank">🏦</div>
                <span class="app-name">Банк</span>
            </div>
            <div class="app-item">
                <div class="app-icon locked">🔒</div>
                <span class="app-name">Скоро</span>
            </div>
        </div>

        <!-- МОДАЛКА УЧЕБА -->
        <div class="modal" id="studyModal">
            <div class="modal-header">
                <h2>Учеба</h2>
                <button class="modal-close" onclick="closeStudy()">✕</button>
            </div>
            <div id="studyContent"></div>
            <!-- Кнопка "Книга для учения" будет вставляться сюда через JS -->
        </div>

        <!-- МОДАЛКА БАНК -->
        <div class="modal" id="bankModal">
            <div class="modal-header">
                <h2>Банк</h2>
                <button class="modal-close" onclick="closeBank()">✕</button>
            </div>
            <div class="empty-bank">
                <div class="big-icon">🏦</div>
                <p style="color:#888;font-size:15px;font-weight:500;">Банковский отдел</p>
                <p style="color:#555;font-size:12px;margin-top:6px;">В разработке...</p>
            </div>
        </div>

        <!-- МОДАЛКА КНИГА ДЛЯ УЧЕНИЯ -->
        <div class="book-modal" id="bookModal">
            <div class="modal-header">
                <h2>📖 Книга для учения</h2>
                <button class="modal-close" onclick="closeBook()">✕</button>
            </div>
            <div class="book-content" id="bookContent"></div>
        </div>

    </div>
</div>

<script>
    // ===== НАСТОЯЩЕЕ ВРЕМЯ =====
    function updateTime() {
        var now = new Date();
        var h = String(now.getHours()).padStart(2, '0');
        var m = String(now.getMinutes()).padStart(2, '0');
        document.getElementById('statusTime').textContent = h + ':' + m;
    }
    updateTime();
    setInterval(updateTime, 10000);

    // ===== НАСТОЯЩАЯ БАТАРЕЯ =====
    function updateBattery() {
        if (navigator.getBattery) {
            navigator.getBattery().then(function(battery) {
                var level = Math.round(battery.level * 100);
                var el = document.getElementById('batteryDisplay');
                el.textContent = '🔋 ' + level + '%';
                if (level < 20) el.style.color = '#e74c3c';
                else if (level < 50) el.style.color = '#f5c842';
                else el.style.color = '#2ecc71';
            });
        } else {
            var fake = Math.floor(Math.random() * 30) + 70;
            document.getElementById('batteryDisplay').textContent = '🔋 ' + fake + '%';
        }
    }
    updateBattery();
    setInterval(updateBattery, 30000);

    // ===== ОТКРЫТИЕ ПРИЛОЖЕНИЙ =====
    function openStudy() {
        document.getElementById('studyModal').classList.add('active');
        renderStudy();
        updateDaysCounter();
    }

    function closeStudy() {
        document.getElementById('studyModal').classList.remove('active');
        if (window.daysInterval) clearInterval(window.daysInterval);
    }

    function openBank() {
        document.getElementById('bankModal').classList.add('active');
    }

    function closeBank() {
        document.getElementById('bankModal').classList.remove('active');
    }

    function openBook() {
        document.getElementById('bookModal').classList.add('active');
        renderBook();
    }

    function closeBook() {
        document.getElementById('bookModal').classList.remove('active');
    }

    document.getElementById('studyModal').addEventListener('click', function(e) {
        if (e.target === this) {
            this.classList.remove('active');
            if (window.daysInterval) clearInterval(window.daysInterval);
        }
    });
    document.getElementById('bankModal').addEventListener('click', function(e) {
        if (e.target === this) this.classList.remove('active');
    });
    document.getElementById('bookModal').addEventListener('click', function(e) {
        if (e.target === this) this.classList.remove('active');
    });

    // ===== ПРОФЕССИИ =====
    var professions = [
        { 
            id: 'fsb', 
            name: 'ФСБ', 
            desc: 'Федеральная служба безопасности', 
            trainingTime: 14, 
            examDate: 'Экзамен: 7-й и 14-й день',
            questions: [
                { q: 'В торговом центре неизвестные открыли стрельбу, слышны взрывы. Ваши действия?', a: 'Немедленно покинуть здание через ближайший выход, если это невозможно — укрыться в подсобном помещении, заблокировать дверь, выключить свет и звук телефона, не создавать панику, дождаться прибытия спецслужб. Не приближаться к окнам, не вступать в контакт с нападавшими.' },
                { q: 'Вы получили сообщение о заложенной бомбе в вашем учебном заведении. Что делать?', a: 'Не паниковать, немедленно сообщить преподавателю или охране, покинуть здание по эвакуационному плану, не пользоваться лифтами, отойти на безопасное расстояние, не трогать подозрительные предметы. Дождаться инструкций от МЧС или полиции.' },
                { q: 'Вас захватили в заложники. Ваши действия?', a: 'Сохранять спокойствие, не спорить с террористами, выполнять их требования если это не угрожает жизни, не делать резких движений, попытаться запомнить детали (количество, внешность, оружие), по возможности незаметно подать сигнал через сообщение или соцсети.' }
            ]
        },
        { 
            id: 'mchs', 
            name: 'МЧС', 
            desc: 'Спасатель, пожарный', 
            trainingTime: 14, 
            examDate: 'Экзамен: 7-й и 14-й день',
            questions: [
                { q: 'Произошло землетрясение средней силы. Вы находитесь в квартире на 5-м этаже. Ваши действия?', a: 'Лечь на пол рядом с кроватью или столом, защитить голову руками, отойти от окон и тяжёлой мебели. После прекращения толчков — покинуть здание по лестнице, не пользуясь лифтом. Помочь пожилым людям и детям.' },
                { q: 'Вы обнаружили возгорание в многоквартирном доме. Что делать?', a: 'Немедленно вызвать пожарную службу по номеру 101 или 112, сообщить точный адрес и этаж. Если пожар небольшой — попытаться потушить огнетушителем. Если огонь сильный — немедленно покинуть помещение, закрыть двери и окна, предупредить соседей. Не пользоваться лифтом.' },
                { q: 'Человек упал в обморок на улице. Ваши действия как спасателя?', a: 'Проверить пульс и дыхание. Если дыхания нет — начать сердечно-легочную реанимацию (30 нажатий на грудную клетку, 2 вдоха). Вызвать скорую помощь по номеру 103 или 112. Уложить пострадавшего на бок в восстановительное положение до приезда врачей.' }
            ]
        },
        { 
            id: 'medic', 
            name: 'Медик', 
            desc: 'Врач, фельдшер', 
            trainingTime: 14, 
            examDate: 'Экзамен: 7-й и 14-й день',
            questions: [
                { q: 'У человека внезапно остановилось сердце. Что делать?', a: 'Немедленно начать сердечно-легочную реанимацию: положить пострадавшего на твёрдую поверхность, проверить дыхание, сделать 30 компрессий грудной клетки глубиной 5-6 см с частотой 100-120 в минуту, затем 2 искусственных вдоха. Продолжать до приезда скорой помощи или появления признаков жизни.' },
                { q: 'Вы видите человека с признаками инсульта (асимметрия лица, нарушение речи, слабость в руке). Ваши действия?', a: 'Немедленно вызвать скорую помощь, усадить или уложить пострадавшего с приподнятой головой. Не давать еду, воду и лекарства. Засечь время начала симптомов, наблюдать за состоянием до приезда врачей.' },
                { q: 'Ребёнок подавился едой и не может дышать. Ваши действия?', a: 'Встать позади ребёнка, обхватить его руками, наклонить вперёд, нанести 5 резких ударов между лопатками. Если не помогает — выполнить 5 компрессий в область живота (приём Геймлиха). Если ребёнок потерял сознание — начать СЛР, чередуя 30 нажатий и 2 вдоха. Вызвать скорую помощь.' }
            ]
        },
        { 
            id: 'mvd', 
            name: 'МВД', 
            desc: 'Полицейский, следователь', 
            trainingTime: 14, 
            examDate: 'Экзамен: 7-й и 14-й день',
            questions: [
                { q: 'Вы стали свидетелем уличного ограбления. Ваши действия как сотрудника полиции?', a: 'Немедленно набрать 102 или 112, сообщить приметы преступников, направление их движения. Если есть возможность — запомнить номер машины, детали внешности. Не вступать в конфликт, если угроза для жизни. Прибыть на место происшествия для дачи показаний.' },
                { q: 'Вы нашли подозрительный предмет в общественном транспорте. Ваши действия?', a: 'Немедленно сообщить водителю или охране, вызвать полицию. Не трогать предмет, не приближаться к нему, вывести людей из автобуса, оградить место находки, дождаться прибытия спецслужб.'
