<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Симулятор</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', system-ui, sans-serif;
            touch-action: manipulation;
            padding: 10px;
        }
        .phone {
            width: 375px;
            max-width: 100%;
            height: 750px;
            background: #0a0a0f;
            border-radius: 40px;
            padding: 18px;
            box-shadow: 0 30px 80px rgba(0,0,0,0.8), inset 0 0 0 2px #2a2a3a;
            position: relative;
            overflow: hidden;
        }
        .phone-screen {
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #0f0f1a 0%, #1a1a2e 100%);
            border-radius: 28px;
            padding: 20px 18px;
            overflow-y: auto;
            position: relative;
            scroll-behavior: smooth;
        }
        .status-bar {
            display: flex;
            justify-content: space-between;
            color: #888;
            font-size: 12px;
            font-weight: 600;
            padding-bottom: 12px;
            border-bottom: 1px solid #1a1a2a;
            margin-bottom: 16px;
        }
        .status-bar .time { color: #fff; }
        .status-icons { display: flex; gap: 6px; }
        .apps-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px 12px;
            margin-top: 20px;
        }
        .app-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            touch-action: manipulation;
            transition: transform 0.15s;
        }
        .app-item:active { transform: scale(0.92); }
        .app-icon {
            width: 62px;
            height: 62px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
            transition: 0.2s;
        }
        .app-icon.study { background: linear-gradient(135deg, #4facfe, #00f2fe); }
        .app-icon.bank { background: linear-gradient(135deg, #43e97b, #38f9d7); }
        .app-icon.locked { background: linear-gradient(135deg, #2d2d44, #3d3d5c); opacity: 0.5; }
        .app-name { color: #bbb; font-size: 11px; font-weight: 500; text-align: center; }

        .modal {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(12px);
            border-radius: 28px;
            padding: 30px 22px;
            z-index: 100;
            overflow-y: auto;
        }
        .modal.active { display: block; }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .modal-header h2 { color: #fff; font-size: 22px; font-weight: 700; }
        .modal-close {
            background: rgba(255,255,255,0.08);
            border: none;
            color: #fff;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            touch-action: manipulation;
            transition: 0.2s;
        }
        .modal-close:active { transform: scale(0.9); background: rgba(255,0,0,0.2); }

        .profession-list { display: flex; flex-direction: column; gap: 12px; margin-top: 8px; }
        .profession-card {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 16px 18px;
            border: 1px solid rgba(255,255,255,0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.2s;
        }
        .profession-card:active { transform: scale(0.97); }
        .profession-card .info h3 { color: #fff; font-size: 15px; font-weight: 600; }
        .profession-card .info p { color: #888; font-size: 12px; margin-top: 2px; }

        .profession-btn {
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            border: none;
            color: #fff;
            padding: 8px 18px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            touch-action: manipulation;
            transition: 0.2s;
            box-shadow: 0 4px 15px rgba(79,172,254,0.3);
            white-space: nowrap;
        }
        .profession-btn:active { transform: scale(0.92); }
        .profession-btn:disabled {
            opacity: 0.4;
            transform: none;
            box-shadow: none;
            cursor: not-allowed;
        }
        .profession-btn.learned {
            background: #2ecc71;
            box-shadow: 0 4px 15px rgba(46,204,113,0.3);
        }
        .profession-btn.hidden { display: none; }

        .empty-bank { text-align: center; padding: 50px 0; color: #555; }
        .empty-bank .big-icon { font-size: 64px; margin-bottom: 16px; }
        .empty-bank p { font-size: 14px; }

        .study-progress {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .study-progress .row {
            display: flex;
            justify-content: space-between;
            color: #ccc;
            font-size: 14px;
            padding: 4px 0;
        }
        .study-progress .row .label { color: #888; }
        .study-progress .row .value { color: #fff; font-weight: 600; }
        .study-progress .bar {
            width: 100%;
            height: 6px;
            background: #1a1a2a;
            border-radius: 10px;
            margin-top: 10px;
            overflow: hidden;
        }
        .study-progress .bar .fill {
            height: 100%;
            background: linear-gradient(90deg, #4facfe, #00f2fe);
            border-radius: 10px;
            transition: width 0.5s;
        }
        .exam-block {
            background: rgba(255,200,0,0.08);
            border: 1px solid rgba(255,200,0,0.2);
            border-radius: 16px;
            padding: 16px;
            margin-top: 12px;
            color: #f5c842;
        }
        .exam-block .title { font-weight: 700; font-size: 15px; }
        .exam-block .question { color: #ddd; font-size: 14px; margin: 8px 0; }
        .exam-options { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
        .exam-options button {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 13px;
            cursor: pointer;
            touch-action: manipulation;
            transition: 0.2s;
            text-align: left;
        }
        .exam-options button:active { transform: scale(0.96); }
        .exam-options button.correct { background: rgba(46,204,113,0.3); border-color: #2ecc71; }
        .exam-options button.wrong { background: rgba(231,76,60,0.3); border-color: #e74c3c; }
        .exam-options button:disabled { opacity: 0.6; }

        .toast-custom {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.9);
            color: #fff;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 14px;
            border: 1px solid #333;
            backdrop-filter: blur(10px);
            white-space: nowrap;
            z-index: 200;
            transition: opacity 0.3s;
        }
        .phone-screen::-webkit-scrollbar { width: 3px; }
        .phone-screen::-webkit-scrollbar-track { background: transparent; }
        .phone-screen::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
        @media (max-width: 400px) {
            .phone { height: 95vh; border-radius: 28px; padding: 12px; }
            .phone-screen { border-radius: 20px; padding: 14px; }
            .app-icon { width: 54px; height: 54px; font-size: 24px; }
            .apps-grid { gap: 14px 8px; }
        }
    </style>
</head>
<body>
<div class="phone">
    <div class="phone-screen" id="phoneScreen">
        <div class="status-bar">
            <span class="time" id="statusTime">12:00</span>
            <div class="status-icons"><span>📶</span><span>📶</span><span>🔋</span></div>
        </div>

        <div class="apps-grid">
            <div class="app-item" id="studyApp">
                <div class="app-icon study">📚</div>
                <span class="app-name">Учеба</span>
            </div>
            <div class="app-item" id="bankApp">
                <div class="app-icon bank">🏦</div>
                <span class="app-name">Банк</span>
            </div>
            <div class="app-item">
                <div class="app-icon locked">🔒</div>
                <span class="app-name">Скоро</span>
            </div>
        </div>

        <div class="modal" id="studyModal">
            <div class="modal-header">
                <h2>Учеба</h2>
                <button class="modal-close" id="closeStudy">✕</button>
            </div>
            <div id="studyContent"></div>
        </div>

        <div class="modal" id="bankModal">
            <div class="modal-header">
                <h2>Банк</h2>
                <button class="modal-close" id="closeBank">✕</button>
            </div>
            <div class="empty-bank">
                <div class="big-icon">🏦</div>
                <p style="color:#888;font-size:15px;font-weight:500;">Банковский отдел</p>
                <p style="color:#555;font-size:12px;margin-top:6px;">В разработке...</p>
            </div>
        </div>
    </div>
</div>

<script>
    const professions = [
        { id: 'mchs', name: 'МЧС', desc: 'Спасатель, пожарный' },
        { id: 'medic', name: 'Медик', desc: 'Врач, фельдшер' },
        { id: 'fsb', name: 'ФСБ', desc: 'Сотрудник госбезопасности' },
        { id: 'mvd', name: 'МВД', desc: 'Полицейский, следователь' },
        { id: 'teacher', name: 'Учитель', desc: 'Преподаватель, наставник' }
    ];

    const examQuestions = {
        mchs: [
            { q: 'Какой номер пожарной службы?', options: ['01', '02', '03', '04'], correct: 0 },
            { q: 'Что нужно делать при пожаре?', options: ['Звонить 01', 'Бежать', 'Прятаться', 'Открыть окна'], correct: 0 }
        ],
        medic: [
            { q: 'Что нужно сделать при остановке сердца?', options: ['Массаж сердца', 'Дать воды', 'Позвать врача', 'Уложить на бок'], correct: 0 },
            { q: 'Какая нормальная температура тела?', options: ['36.6', '37.5', '38.0', '39.0'], correct: 0 }
        ],
        fsb: [
            { q: 'Что означает ФСБ?', options: ['Федеральная служба безопасности', 'Федеральная служба банков', 'Фонд спасения бизнеса', 'Федерация спорта'], correct: 0 },
            { q: 'Кто руководит ФСБ?', options: ['Директор', 'Президент', 'Министр', 'Генерал'], correct: 0 }
        ],
        mvd: [
            { q: 'Какой номер полиции?', options: ['02', '01', '03', '04'], correct: 0 },
            { q: 'Кто стоит на страже порядка?', options: ['Полиция', 'Армия', 'Суд', 'Прокуратура'], correct: 0 }
        ],
        teacher: [
            { q: 'Что такое педагогика?', options: ['Наука о воспитании', 'Наука о лечении', 'Наука о технике', 'Наука о деньгах'], correct: 0 },
            { q: 'Кто такой учитель?', options: ['Преподаватель', 'Врач', 'Инженер', 'Адвокат'], correct: 0 }
        ]
    };

    let state = {
        selectedProfession: null,
        startDate: null,
        exam1Passed: false,
        exam2Passed: false,
        finished: false,
        examMode: false,
        currentExamIndex: 0,
        examAnswered: false,
        examType: null
    };

    let examQuestionsCache = [];
    let updateInterval = null;

    const studyModal = document.getElementById('studyModal');
    const bankModal = document.getElementById('bankModal');
    const studyContent = document.getElementById('studyContent');
    const statusTime = document.getElementById('statusTime');

    function showToast(text) {
        const old = document.querySelector('.toast-custom');
        if (old) old.remove();
        const toast = document.createElement('div');
        toast.className = 'toast-custom';
        toast.textContent = text;
        document.getElementById('phoneScreen').appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }

    function saveState() {
        try { localStorage.setItem('simulatorState', JSON.stringify(state)); } catch(e) {}
    }

    function loadState() {
        try {
            const saved = localStorage.getItem('simulatorState');
            if (saved) {
                const data = JSON.parse(saved);
                state.selectedProfession = data.selectedProfession || null;
                state.startDate = data.startDate || null;
                state.exam1Passed = data.exam1Passed || false;
                state.exam2Passed = data.exam2Passed || false;
                state.finished = data.finished || false;
                state.examMode = data.examMode || false;
                state.currentExamIndex = data.currentExamIndex || 0;
                state.examAnswered = data.examAnswered || false;
                state.examType = data.examType || null;
            }
        } catch(e) {}
    }

    function getDaysPassed() {
        if (!state.startDate) return 0;
        const start = new Date(state.startDate);
        const now = new Date();
        const diff = now - start;
        return Math.floor(diff / (1000 * 60 * 60 * 24));
    }

    function checkProgress() {
        if (!state.selectedProfession || state.finished) return;
        const days = getDaysPassed();
        
        if (days >= 7 && !state.exam1Passed && !state.examMode) {
            showToast('Прошло 7 дней! Пора сдавать первый экзамен!');
        }
        if (days >= 14 && state.exam1Passed && !state.exam2Passed && !state.examMode) {
            showToast('Прошло 14 дней! Пора сдавать второй экзамен!');
        }
        if (days >= 14 && state.exam1Passed && state.exam2Passed && !state.finished) {
            state.finished = true;
            saveState();
            showToast('Обучение завершено! Поздравляем!');
            if (studyModal.classList.contains('active')) renderStudy();
        }
        if (studyModal.classList.contains('active')) {
            renderStudy();
        }
    }

    function renderStudy() {
        const prof = professions.find(p => p.id === state.selectedProfession);
        const days = getDaysPassed();

        if (!state.selectedProfession) {
            studyContent.innerHTML = `<div class="profession-list" id="professionList"></div>`;
            renderProfessionList();
            return;
        }

        let html = `
            <div class="study-progress">
                <div class="row"><span class="label">Профессия</span><span class="value">${prof ? prof.name : '—'}</span></div>
                <div class="row"><span class="label">День обучения</span><span class="value">${Math.min(days, 14)} / 14</span></div>
                <div class="bar"><div class="fill" style="width:${Math.min(100, (days/14)*100)}%"></div></div>
            </div>
        `;

        if (state.finished) {
            html += `
                <div style="background:rgba(46,204,113,0.1);border:1px solid #2ecc71;border-radius:16px;padding:20px;text-align:center;color:#2ecc71;">
                    <div style="font-size:24px;margin-bottom:8px;">Обучение завершено</div>
                    <div style="color:#aaa;font-size:13px;">Вы успешно освоили профессию ${prof ? prof.name : ''}</div>
                </div>
            `;
            studyContent.innerHTML = html;
            return;
        }

        if (state.examMode) {
            html += renderExam();
            studyContent.innerHTML = html;
            return;
        }

        if (days >= 7 && !state.exam1Passed) {
            html += `
                <div class="exam-block">
                    <div class="title">Экзамен 1 (неделя 1)</div>
                    <div style="margin-top:10px;">
                        <button class="profession-btn" id="startExam1" style="width:100%;">Начать экзамен</button>
                    </div>
                </div>
            `;
        }

        if (days >= 14 && state.exam1Passed && !state.exam2Passed) {
            html += `
                <div class="exam-block">
                    <div class="title">Экзамен 2 (неделя 2)</div>
                    <div style="margin-top:10px;">
                        <button class="profession-btn" id="startExam2" style="width:100%;">Начать экзамен</button>
                    </div>
                </div>
            `;
        }

        if (days < 7 && !state.exam1Passed) {
            html += `
                <div style="color:#666;text-align:center;margin-top:16px;font-size:13px;">
                    До первого экзамена осталось: ${7 - days} дней
                </div>
            `;
        }

        studyContent.innerHTML = html;
        document.getElementById('startExam1')?.addEventListener('click', () => startExam(1));
        document.getElementById('startExam2')?.addEventListener('click', () => startExam(2));
    }

    function renderProfessionList() {
        const list = document.getElementById('professionList');
        if (!list) return;
        list.innerHTML = '';
        professions.forEach(p => {
            const card = document.createElement('div');
            card.className = 'profession-card';
            card.innerHTML = `
                <div class="info">
                    <h3>${p.name}</h3>
                    <p>${p.desc}</p>
                </div>
                <button class="profession-btn" data-id="${p.id}">Выбрать</button>
            `;
            card.querySelector('button').addEventListener('click', () => {
                selectProfession(p.id);
            });
            list.appendChild(card);
        });
    }

    function selectProfession(id) {
        if (state.selectedProfession) {
            showToast('Профессия уже выбрана. Выбрать можно только один раз.');
            return;
        }
        state.selectedProfession = id;
        state.startDate = new Date().toISOString();
        state.exam1Passed = false;
        state.exam2Passed = false;
        state.finished = false;
        saveState();
        renderStudy();
        showToast('Обучение началось! Длительность: 14 дней.');
        if (updateInterval) clearInterval(updateInterval);
        updateInterval = setInterval(checkProgress, 10000);
    }

    function startExam(examNumber) {
        if (state.examMode) return;
        const profId = state.selectedProfession;
        if (!profId) return;

        const questions = examQuestions[profId];
        if (!questions) return;

        examQuestionsCache = questions;
        state.examMode = true;
        state.currentExamIndex = 0;
        state.examAnswered = false;
        state.examType = examNumber;
        saveState();
        renderStudy();
    }

    function renderExam() {
        const questions = examQuestionsCache;
        if (!questions || questions.len
