<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Симулятор</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', system-ui, sans-serif;
            touch-action: none;
            padding: 10px;
        }
        .phone {
            width: 375px;
            max-width: 100%;
            height: 750px;
            background: #0a0a0f;
            border-radius: 40px;
            padding: 18px;
            box-shadow: 0 30px 80px rgba(0,0,0,0.8), inset 0 0 0 2px #2a2a3a;
            position: relative;
            overflow: hidden;
        }
        .phone-screen {
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #0f0f1a 0%, #1a1a2e 100%);
            border-radius: 28px;
            padding: 20px 18px;
            overflow-y: auto;
            position: relative;
            scroll-behavior: smooth;
            -webkit-tap-highlight-color: transparent;
        }
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #fff;
            font-size: 12px;
            font-weight: 600;
            padding-bottom: 12px;
            border-bottom: 1px solid #1a1a2a;
            margin-bottom: 16px;
            -webkit-tap-highlight-color: transparent;
        }
        .status-icons { display: flex; gap: 6px; font-size: 13px; align-items: center; }

        .apps-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px 12px;
            margin-top: 20px;
            position: relative;
            min-height: 350px;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
        }

        /* Сетка для перетаскивания */
        .drop-zone {
            border: 2px dashed rgba(255,255,255,0.08);
            border-radius: 16px;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255,255,255,0.05);
            font-size: 12px;
            transition: all 0.2s;
            background: rgba(255,255,255,0.01);
        }
        .drop-zone.drag-over {
            border-color: #2ecc71;
            background: rgba(46,204,113,0.05);
            transform: scale(1.02);
        }
        .drop-zone .placeholder-text {
            pointer-events: none;
        }

        .app-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            cursor: grab;
            touch-action: none;
            transition: transform 0.12s, opacity 0.2s;
            z-index: 1;
            padding: 10px 8px;
            border-radius: 14px;
            background: transparent;
            border: none;
            -webkit-tap-highlight-color: transparent;
            position: relative;
        }
        .app-item:active { transform: scale(0.92); }
        .app-item.dragging {
            opacity: 0;
            transform: scale(0.8);
            z-index: 0;
            pointer-events: none;
        }
        .app-icon {
            width: 62px;
            height: 62px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            pointer-events: none;
            flex-shrink: 0;
            -webkit-tap-highlight-color: transparent;
        }
        .app-icon.study { background: linear-gradient(135deg, #4facfe, #00f2fe); }
        .app-icon.bank { background: linear-gradient(135deg, #43e97b, #38f9d7); }
        .app-icon.locked { background: linear-gradient(135deg, #2d2d44, #3d3d5c); opacity: 0.5; }
        .app-name {
            color: #ddd;
            font-size: 11px;
            font-weight: 500;
            pointer-events: none;
            -webkit-tap-highlight-color: transparent;
            text-align: center;
            line-height: 1.2;
            text-shadow: 0 1px 4px rgba(0,0,0,0.5);
        }

        /* Клон при перетаскивании */
        .drag-clone {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            opacity: 0.9;
            transform: scale(1.08);
            background: rgba(255,255,255,0.05);
            border-radius: 14px;
            padding: 10px 8px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
            border: 2px solid rgba(46,204,113,0.3);
            transition: none;
        }

        .apply-btn {
            background: #2ecc71;
            border: none;
            color: #fff;
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            touch-action: manipulation;
            transition: 0.2s;
            box-shadow: 0 4px 20px rgba(46,204,113,0.3);
            width: 100%;
            margin-top: 16px;
        }
        .apply-btn:active { transform: scale(0.96); }
        .apply-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            box-shadow: none;
        }

        .modal {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(12px);
            border-radius: 28px;
            padding: 30px 22px;
            z-index: 100;
            overflow-y: auto;
        }
        .modal.active { display: block; }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .modal-header h2 { color: #fff; font-size: 22px; font-weight: 700; }
        .modal-close {
            background: rgba(255,255,255,0.08);
            border: none;
            color: #fff;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            touch-action: manipulation;
            transition: 0.2s;
        }
        .modal-close:active { transform: scale(0.9); background: rgba(255,0,0,0.2); }

        .profession-list { display: flex; flex-direction: column; gap: 12px; margin-top: 8px; }
        .profession-card {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 16px 18px;
            border: 1px solid rgba(255,255,255,0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.2s;
            cursor: pointer;
        }
        .profession-card:active { transform: scale(0.97); }
        .profession-card .info h3 { color: #fff; font-size: 15px; font-weight: 600; }
        .profession-card .info p { color: #888; font-size: 12px; margin-top: 2px; }

        .profession-btn {
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            border: none;
            color: #fff;
            padding: 8px 18px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            touch-action: manipulation;
            transition: 0.2s;
            box-shadow: 0 4px 15px rgba(79,172,254,0.3);
            white-space: nowrap;
        }
        .profession-btn:active { transform: scale(0.92); }
        .profession-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .profession-detail {
            display: none;
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
            padding: 14px 16px;
            margin-top: 10px;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .profession-detail.open { display: block; }
        .profession-detail .row {
            display: flex;
            justify-content: space-between;
            color: #ccc;
            font-size: 13px;
            padding: 4px 0;
        }
        .profession-detail .row .label { color: #888; }
        .profession-detail .row .value { color: #fff; font-weight: 500; }

        .selected-profession-block {
            background: rgba(46,204,113,0.1);
            border: 1px solid #2ecc71;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            margin-bottom: 16px;
        }
        .selected-profession-block .prof-name { color: #fff; font-size: 20px; font-weight: 600; }
        .selected-profession-block .prof-desc { color: #aaa; font-size: 13px; margin-top: 4px; }
        .selected-profession-block .status-text { color: #2ecc71; font-size: 13px; margin-top: 8px; }
        .selected-profession-block .days-left-big { color: #4facfe; font-size: 18px; font-weight: 700; margin-top: 6px; }

        .book-btn {
            background: #2ecc71;
            border: none;
            color: #fff;
            padding: 14px 20px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            touch-action: manipulation;
            transition: 0.2s;
            box-shadow: 0 4px 20px rgba(46,204,113,0.4);
            width: 100%;
            margin-top: 16px;
        }
        .book-btn:active { transform: scale(0.96); }

        .book-modal {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.92);
            backdrop-filter: blur(16px);
            border-radius: 28px;
            padding: 30px 22px;
            z-index: 200;
            overflow-y: auto;
        }
        .book-modal.active { display: block; }
        .book-modal .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .book-modal .modal-header h2 { color: #2ecc71; font-size: 20px; font-weight: 700; }
        .book-modal .modal-close {
            background: rgba(255,255,255,0.08);
            border: none;
            color: #fff;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
        }
        .book-content { color: #ddd; font-size: 14px; line-height: 1.6; }
        .book-content .question-block {
            background: rgba(255,255,255,0.04);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 14px;
            border-left: 3px solid #2ecc71;
        }
        .book-content .question-block .q { color: #fff; font-weight: 600; margin-bottom: 6px; }
        .book-content .question-block .a { color: #aaa; }

        .toast-custom {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.9);
            color: #fff;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 14px;
            border: 1px solid #333;
            backdrop-filter: blur(10px);
            white-space: nowrap;
            z-index: 200;
            transition: opacity 0.3s;
        }

        .phone-screen::-webkit-scrollbar { width: 3px; }
        .phone-screen::-webkit-scrollbar-track { background: transparent; }
        .phone-screen::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }

        * { -webkit-tap-highlight-color: transparent; }
        *:focus { outline: none; }

        @media (max-width: 400px) {
            .phone { height: 95vh; border-radius: 28px; padding: 12px; }
            .phone-screen { border-radius: 20px; padding: 14px; }
            .app-icon { width: 52px; height: 52px; font-size: 24px; }
            .app-name { font-size: 10px; }
            .app-item { padding: 6px; }
        }

        /* ===== БАНК ===== */
        .sber-card {
            background: linear-gradient(135deg, #1a6d3e, #0d4a2a);
            border-radius: 16px;
            padding: 20px;
            color: #fff;
            margin-bottom: 12px;
            box-shadow: 0 8px 30px rgba(26,109,62,0.3);
            position: relative;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        .sber-card::before {
            content: '★';
            position: absolute;
            top: -20px;
            right: -10px;
            font-size: 80px;
            opacity: 0.08;
            color: #fff;
        }
        .sber-card .bank-name { font-size: 12px; opacity: 0.7; letter-spacing: 1px; }
        .sber-card .card-holder { font-size: 11px; opacity: 0.6; margin-top: 6px; text-transform: uppercase; }
        .sber-card .card-bottom { display: flex; justify-content: space-between; margin-top: 6px; }
        .sber-card .card-bottom span { font-size: 10px; opacity: 0.5; }

        .card-number-box {
            background: rgba(0,0,0,0.35);
            border-radius: 10px;
            padding: 14px 18px;
            margin: 10px 0 8px 0;
            text-align: center;
            cursor: pointer;
            user-select: none;
            border: 1px solid rgba(255,255,255,0.06);
            transition: all 0.3s ease;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        .card-number-box.collapsed { padding: 4px 14px; background: rgba(0,0,0,0.15); }
        .card-number-box .number {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 3px;
            font-family: 'Courier New', monospace;
            color: #fff;
            transition: all 0.3s ease;
            white-space: nowrap;
            display: flex;
            justify-content: center;
            gap: 6px;
        }
        .card-number-box .number .group { display: inline-block; }
        .card-number-box .number.collapsed { font-size: 13px; letter-spacing: 2px; gap: 4px; }

        .sber-balance {
            background: rgba(255,255,255,0.04);
            border-radius: 12px;
            padding: 14px 18px;
            margin-bottom: 16px;
            border: 1px solid rgba(255,255,255,0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
            -webkit-tap-highlight-color: transparent;
        }
        .sber-balance .label { color: #888; font-size: 13px; }
        .sber-balance .amount { color: #f5c842; font-size: 24px; font-weight: 700; }

        .sber-history {
            background: rgba(255,255,255,0.04);
            border-radius: 12px;
            padding: 14px 16px;
            margin-top: 12px;
            border: 1px solid rgba(255,255,255,0.06);
            max-height: 200px;
            overflow-y: auto;
            -webkit-tap-highlight-color: transparent;
        }
        .sber-history .history-title {
            color: #aaa;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding-bottom: 6px;
        }
        .sber-history .history-empty { color: #555; font-size: 13px; text-align: center; padding: 16px 0; }
        .sber-history .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.03);
            font-size: 13px;
        }
        .sber-history .history-item .h-left { color: #ccc; }
        .sber-history .history-item .h-left .h-detail { color: #888; font-size: 11px; }
        .sber-history .history-item .h-amount { color: #f5c842; font-weight: 600; }
        .sber-history .history-item .h-amount.minus { color: #e74c3c; }

        .sber-menu {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin: 12px 0;
            -webkit-tap-highlight-color: transparent;
        }
        .sber-menu-item {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 12px;
            padding: 14px 10px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
            color: #ddd;
            -webkit-tap-highlight-color: transparent;
        }
        .sber-menu-item:active { transform: scale(0.95); background: rgba(255,255,255,0.08); }
        .sber-menu-item .icon { font-size: 24px; display: block; margin-bottom: 4px; }
        .sber-menu-item .label { font-size: 11px; font-weight: 500; }

        .sber-input {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 12px 14px;
            color: #fff;
            font-size: 15px;
            width: 100%;
            outline: none;
            margin-bottom: 10px;
            -webkit-tap-highlight-color: transparent;
        }
        .sber-input::placeholder { color: #555; }
        .sber-input:focus { border-color: #1a6d3e; }

        .sber-btn {
            background: linear-gradient(135deg, #1a6d3e, #0d4a2a);
            border: none;
            color: #fff;
            padding: 12px 20px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            touch-action: manipulation;
            transition: 0.2s;
            width: 100%;
            margin-top: 4px;
            -webkit-tap-highlight-color: transparent;
        }
        .sber-btn:active { transform: scale(0.96); }
        .sber-btn.green { background: linear-gradient(135deg, #2ecc71, #27ae60); }
        .sber-btn.red { background: linear-gradient(135deg, #e74c3c, #c0392b); }
        .sber-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        .sber-back {
            background: rgba(255,255,255,0.06);
            border: none;
            color: #4facfe;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            touch-action: manipulation;
            transition: 0.2s;
            -webkit-tap-highlight-color: transparent;
        }
        .sber-back:active { transform: scale(0.92); }

        .transfer-method {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            -webkit-tap-highlight-color: transparent;
        }
        .transfer-method button {
            flex: 1;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            color: #aaa;
            padding: 10px;
            border-radius: 10px;
            font-size: 12px;
            cursor: pointer;
            transition: 0.2s;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        .transfer-method button:active { transform: scale(0.95); }
        .transfer-method button.active { border-color: #1a6d3e; color: #fff; background: rgba(26,109,62,0.2); }

        .sber-history::-webkit-scrollbar { width: 3px; }
        .sber-history::-webkit-scrollbar-track { background: transparent; }
        .sber-history::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
    </style>
</head>
<body>
<div class="phone">
    <div class="phone-screen" id="phoneScreen">

        <div class="status-bar">
            <span id="statusTime">12:00</span>
            <div class="status-icons">
                <span>📶</span>
                <span>📶</span>
                <span id="batteryDisplay">🔋 100%</span>
            </div>
        </div>

        <div class="apps-grid" id="appsGrid">
            <!-- Иконки будут вставляться сюда через JS -->
        </div>

        <!-- Кнопка "Применить" -->
        <button class="apply-btn" id="applyBtn" disabled>✅ Применить</button>

        <div class="modal" id="studyModal">
            <div class="modal-header">
                <h2>Учеба</h2>
                <button class="modal-close" id="closeStudyBtn">✕</button>
            </div>
            <div id="studyContent"></div>
        </div>

        <div class="modal" id="bankModal">
            <div class="modal-header">
                <h2>Банк</h2>
                <button class="modal-close" id="closeBankBtn">✕</button>
            </div>
            <div id="bankContent"></div>
        </div>

        <div class="book-modal" id="bookModal">
            <div class="modal-header">
                <h2>📖 Книга для учения</h2>
                <button class="modal-close" id="closeBookBtn">✕</button>
            </div>
            <div class="book-content" id="bookContent"></div>
        </div>

    </div>
</div>

<script>
    // ============================================================
    // ВРЕМЯ И БАТАРЕЯ
    // ============================================================
    function updateTime() {
        var now = new Date();
        document.getElementById('statusTime').textContent =
            String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
    }
    updateTime();
    setInterval(updateTime, 5000);

    function updateBattery() {
        if (navigator.getBattery) {
            navigator.getBattery().then(function(battery) {
                var level = Math.round(battery.level * 100);
                var el = document.getElementById('batteryDisplay');
                el.textContent = '🔋 ' + level + '%';
                el.style.color = level < 20 ? '#e74c3c' : level < 50 ? '#f5c842' : '#2ecc71';
            }).catch(function() { document.getElementById('batteryDisplay').textContent = '🔋 72%'; });
        } else {
            document.getElementById('batteryDisplay').textContent = '🔋 68%';
        }
    }
    updateBattery();
    setInterval(updateBattery, 5000);

    // ============================================================
    // DRAG-AND-DROP С СЕТКОЙ И КНОПКОЙ "ПРИМЕНИТЬ"
    // ============================================================
    var dragData = {
        dragEl: null,
        offsetX: 0,
        offsetY: 0,
        clone: null,
        isDragging: false,
        targetIndex: -1,
        startIndex: -1
    };

    var appItems = [
        { id: 'studyAppBtn', icon: 'study', label: 'Учеба', emoji: '📚' },
        { id: 'bankAppBtn', icon: 'bank', label: 'Банк', emoji: '🏦' },
        { id: 'lockedAppBtn', icon: 'locked', label: 'Скоро', emoji: '🔒' }
    ];

    var currentOrder = [];

    function renderGrid(order) {
        var grid = document.getElementById('appsGrid');
        grid.innerHTML = '';

        // Добавляем 3 пустые зоны для перетаскивания
        var totalSlots = 9;
        var itemsToShow = order || ['studyAppBtn', 'bankAppBtn', 'lockedAppBtn'];

        for (var i = 0; i < totalSlots; i++) {
            var slot = document.createElement('div');
            slot.className = 'drop-zone';
            slot.dataset.index = i;

            if (i < itemsToShow.length) {
                var appId = itemsToShow[i];
                var app = appItems.find(function(a) { return a.id === appId; });
                if (app) {
                    var itemDiv = document.createElement('div');
                    itemDiv.className = 'app-item';
                    itemDiv.id = app.id;
                    itemDiv.draggable = false;
                    itemDiv.innerHTML = `
                        <div class="app-icon ${app.icon}">${app.emoji}</div>
                        <span class="app-name">${app.label}</span>
                    `;
                    slot.appendChild(itemDiv);
                    slot.style.border = 'none';
                    slot.style.background = 'none';
                    slot.style.minHeight = 'auto';
                }
            } else {
                slot.innerHTML = '<span class="placeholder-text">⬜</span>';
            }

            grid.appendChild(slot);
        }

        initDrag();
        updateApplyBtn();
    }

    function initDrag() {
        document.querySelectorAll('.app-item').forEach(function(item) {
            item.addEventListener('pointerdown', function(e) {
                if (e.target.closest('.app-icon') || e.target.closest('.app-name') || e.target.closest('.app-item')) {
                    e.preventDefault();
                    e.stopPropagation();
                    startDrag(e, item);
                }
            });
        });

        // Подсветка зон при перетаскивании
        document.addEventListener('pointermove', function(e) {
            if (dragData.isDragging) {
                document.querySelectorAll('.drop-zone').forEach(function(zone) {
                    var rect = zone.getBoundingClientRect();
                    var cx = rect.left + rect.width/2, cy = rect.top + rect.height/2;
                    var dist = Math.sqrt(Math.pow(e.clientX - cx, 2) + Math.pow(e.clientY - cy, 2));
                    if (dist < 80 && !zone.querySelector('.app-item')) {
                        zone.classList.add('drag-over');
                    } else {
                        zone.classList.remove('drag-over');
                    }
                });
            }
        });

        document.addEventListener('pointerup', function(e) {
            if (dragData.isDragging) endDrag(e);
        });
    }

    function startDrag(e, item) {
        var rect = item.getBoundingClientRect();
        var parentZone = item.closest('.drop-zone');
        dragData.dragEl = item;
        dragData.offsetX = e.clientX - rect.left;
        dragData.offsetY = e.clientY - rect.top;
        dragData.isDragging = true;
        dragData.startIndex = parseInt(parentZone.dataset.index);

        // Создаём клон
        var clone = item.cloneNode(true);
        clone.className = 'drag-clone';
        clone.style.width = rect.width + 'px';
        clone.style.left = (e.clientX - dragData.offsetX) + 'px';
        clone.style.top = (e.clientY - dragData.offsetY) + 'px';
        document.body.appendChild(clone);
        dragData.clone = clone;

        // Скрываем оригинал
        item.classList.add('dragging');

        // Активируем кнопку "Применить"
        document.getElementById('applyBtn').disabled = false;
    }

    function endDrag(e) {
        if (!dragData.isDragging) return;
        if (dragData.clone) { dragData.clone.remove(); dragData.clone = null; }

        // Находим целевую зону
        var targetZone = null;
        document.querySelectorAll('.drop-zone').forEach(function(zone) {
            var rect = zone.getBoundingClientRect();
            var cx = rect.left + rect.width/2, cy = rect.top + rect.height/2;
            var dist = Math.sqrt(Math.pow(e.clientX - cx, 2) + Math.pow(e.clientY - cy, 2));
            if (dist < 80 && !zone.querySelector('.app-item')) {
                targetZone = zone;
            }
        });

        var dragEl = dragData.dragEl;
        dragEl.classList.remove('dragging');

        // Если есть целевая зона — перемещаем иконку
        if (targetZone) {
            var targetIndex = parseInt(targetZone.dataset.index);
            var startIndex = dragData.startIndex;

            // Обновляем порядок
            var order = getCurrentOrder();
            var movedItem = order.splice(startIndex, 1)[0];
            if (movedItem) {
                order.splice(targetIndex, 0, movedItem);
                currentOrder = order;
                renderGrid(order);
            }
        } else {
            // Возвращаем на место
            var grid = document.getElementById('appsGrid');
            var zones = grid.querySelectorAll('.drop-zone');
            var startZone = zones[dragData.startIndex];
            if (startZone && !startZone.querySelector('.app-item')) {
                startZone.appendChild(dragEl);
                startZone.style.border = 'none';
                startZone.style.background = 'none';
                startZone.style.minHeight = 'auto';
                startZone.querySelector('.placeholder-text')?.remove();
            }
        }

        dragData.isDragging = false;
        dragData.dragEl = null;
        document.getElementById('applyBtn').disabled = true;
    }

    function getCurrentOrder() {
        var order = [];
        document.querySelectorAll('.drop-zone').forEach(function(zone) {

        });
        return order;
    }

                </div>
                <div class="sber-card" style="background:linear-gradient(135deg,#6d1a1a,#4a0d0d);">
                    <div class="bank-name">💳 КРЕДИТ</div>
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;">
                        <span style="opacity:0.6;font-size:13px;">Долг</span>
                        <span style="font-size:22px;font-weight:700;color:#e74c3c;">${bankData.credit} ₽</span>
                    </div>
                    <div style="color:#f5c842;font-size:14px;margin-top:6px;">Проценты: +20%</div>
                    <div style="color:#888;font-size:13px;">К возврату: ${Math.floor(bankData.credit * 1.2)} ₽</div>
                    <div style="color:#888;font-size:12px;">Осталось дней: ${daysLeft}</div>
                </div>
                <button class="sber-btn green" onclick="payCredit()" ${bankData.balance < Math.floor(bankData.credit * 1.2) ? 'disabled' : ''}>
                    ${bankData.balance >= Math.floor(bankData.credit * 1.2) ? 'Погасить кредит' : 'Недостаточно средств'}
                </button>
            `;
            return;
        }

        content.innerHTML = `
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
                <button class="sber-back" onclick="renderBank()">← Назад</button>
            </div>
            <div style="color:#fff;font-size:18px;font-weight:600;margin-bottom:12px;">💳 Взять кредит</div>
            <div style="color:#888;font-size:13px;margin-bottom:6px;">Максимум: ${bankData.balance * 2} ₽</div>
            <div style="color:#888;font-size:13px;margin-bottom:6px;">Проценты: 20%</div>
            <div style="color:#888;font-size:13px;margin-bottom:16px;">Срок: до окончания обучения</div>
            <input class="sber-input" id="creditAmount" placeholder="Сумма кредита" type="number" min="10">
            <button class="sber-btn" onclick="takeCredit()">Взять кредит</button>
        `;
    }

    function takeCredit() {
        var amount = parseInt(document.getElementById('creditAmount').value);
        if (!amount || amount < 10) { showToast('Минимальная сумма: 10 ₽'); return; }
        var maxCredit = bankData.balance * 2;
        if (amount > maxCredit) { showToast('Максимальная сумма: ' + maxCredit + ' ₽'); return; }

        bankData.balance += amount;
        bankData.credit = amount;
        bankData.creditAmount = amount;
        bankData.creditDate = new Date().toISOString();
        saveBankData();
        renderBank();
        showToast('✅ Кредит выдан! Сумма: ' + amount + ' ₽');
    }

    function payCredit() {
        var total = Math.floor(bankData.credit * 1.2);
        if (bankData.balance < total) { showToast('❌ Недостаточно средств'); return; }

        bankData.balance -= total;
        bankData.credit = 0;
        bankData.creditAmount = 0;
        bankData.creditDate = null;
        saveBankData();
        renderBank();
        showToast('✅ Кредит погашен!');
    }

    // ============================================================
    // ПЕРЕВОД
    // ============================================================
    var transferMethod = 'card';

    function showTransfer() {
        var content = document.getElementById('bankContent');
        content.innerHTML = `
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
                <button class="sber-back" onclick="renderBank()">← Назад</button>
            </div>
            <div style="color:#fff;font-size:18px;font-weight:600;margin-bottom:12px;">📤 Перевод</div>
            <div style="color:#888;font-size:13px;margin-bottom:12px;">Ваш баланс: ${bankData.balance} ₽</div>
            <div class="transfer-method">
                <button id="transferCardBtn" class="active" onclick="setTransferMethod('card')">💳 По карте</button>
                <button id="transferPhoneBtn" onclick="setTransferMethod('phone')">📱 По телефону</button>
            </div>
            <div id="transferInputs">
                <input class="sber-input" id="transferRecipient" placeholder="Номер карты (16 цифр)">
                <input class="sber-input" id="transferAmount" placeholder="Сумма перевода" type="number" min="1">
            </div>
            <button class="sber-btn green" onclick="makeTransfer()">Перевести</button>
            <div style="color:#555;font-size:12px;text-align:center;margin-top:8px;">Комиссия: 0 ₽</div>
        `;
        updateTransferMethodUI();
    }

    function setTransferMethod(method) {
        transferMethod = method;
        updateTransferMethodUI();
        var input = document.getElementById('transferRecipient');
        if (method === 'card') {
            input.placeholder = 'Номер карты (16 цифр)';
            input.maxLength = 19;
            input.type = 'text';
        } else {
            input.placeholder = 'Номер телефона (11 цифр)';
            input.maxLength = 11;
            input.type = 'tel';
        }
    }

    function updateTransferMethodUI() {
        var cardBtn = document.getElementById('transferCardBtn');
        var phoneBtn = document.getElementById('transferPhoneBtn');
        if (cardBtn) cardBtn.className = transferMethod === 'card' ? 'active' : '';
        if (phoneBtn) phoneBtn.className = transferMethod === 'phone' ? 'active' : '';
    }

    function makeTransfer() {
        var recipient = document.getElementById('transferRecipient').value.replace(/\s/g, '');
        var amount = parseInt(document.getElementById('transferAmount').value);

        if (!recipient) { showToast('Введите номер получателя'); return; }

        var recipientDisplay = '';
        if (transferMethod === 'card') {
            if (recipient.length < 16) { showToast('Введите 16 цифр карты'); return; }
            if (recipient === bankData.cardNumber.replace(/\s/g, '')) { showToast('❌ Нельзя перевести себе'); return; }
            recipientDisplay = 'Карта: ' + recipient;
        } else {
            if (recipient.length < 11) { showToast('Введите 11 цифр телефона'); return; }
            if (recipient === bankData.phone) { showToast('❌ Нельзя перевести себе'); return; }
            recipientDisplay = 'Телефон: ' + recipient;
        }

        if (!amount || amount < 1) { showToast('Введите сумму перевода'); return; }
        if (amount > bankData.balance) { showToast('❌ Недостаточно средств'); return; }

        var now = new Date();
        var timeStr = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
        bankData.history.push({ type: 'out', amount: amount, recipient: recipientDisplay, time: timeStr });

        bankData.balance -= amount;
        saveBankData();
        renderBank();
        showToast('✅ Перевод выполнен! Сумма: ' + amount + ' ₽');
    }

    // ============================================================
    // ОТКРЫТИЕ/ЗАКРЫТИЕ ПРИЛОЖЕНИЙ
    // ============================================================
    function openStudy() {
        document.getElementById('studyModal').classList.add('active');
        renderStudy();
    }

    function closeStudy() {
        document.getElementById('studyModal').classList.remove('active');
    }

    function openBank() {
        document.getElementById('bankModal').classList.add('active');
        loadBankData();
        renderBank();
    }

    function closeBank() {
        bankData.loggedIn = false;
        saveBankData();
        document.getElementById('bankModal').classList.remove('active');
    }

    // ============================================================
    // НАЗНАЧЕНИЕ СОБЫТИЙ
    // ============================================================
    document.getElementById('closeStudyBtn').addEventListener('click', closeStudy);
    document.getElementById('closeBankBtn').addEventListener('click', closeBank);
    document.getElementById('closeBookBtn').addEventListener('click', closeBook);

    document.getElementById('studyModal').addEventListener('click', function(e) {
        if (e.target === this) closeStudy();
    });
    document.getElementById('bankModal').addEventListener('click', function(e) {
        if (e.target === this) closeBank();
    });
    document.getElementById('bookModal').addEventListener('click', function(e) {
        if (e.target === this) closeBook();
    });

    // Используем делегирование для кликов по иконкам
    document.getElementById('appsGrid').addEventListener('click', function(e) {
        var item = e.target.closest('.app-item');
        if (item) {
            if (item.id === 'studyAppBtn') openStudy();
            else if (item.id === 'bankAppBtn') openBank();
        }
    });

    // ============================================================
    // ЗАПУСК
    // ============================================================
    renderStudy();

    setInterval(function() {
        var counter = document.getElementById('daysCounter');
        if (counter) {
            var days = getDaysLeft();
            counter.textContent = days;
            var big = document.querySelector('.days-left-big');
            if (big && !big.textContent.includes('Обучение завершено')) {
                big.textContent = 'Осталось дней: ' + days;
            }
            if (days <= 0) {
                var status = document.querySelector('.status-text');
                if (status) status.textContent = 'Обучение завершено';
            }
        }
    }, 1000);
</script>
</body>
</html>
